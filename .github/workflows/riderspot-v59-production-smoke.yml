name: RiderSpot v59 production deployment smoke
on:
  push:
    branches: [feature/riderspot-lossless-gps-v59]
    paths: ['.github/workflows/riderspot-v59-production-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify actual production v59 and all retained legacy features
        env:
          BASE: https://rider-spot.jazzhjm.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.BASE;
          async function read(path,options={}){
            const response=await fetch(base+path,{...options,signal:AbortSignal.timeout(30000)});
            return {response,body:await response.text()};
          }
          const {response:root,body:home}=await read('/');
          assert.equal(root.status,200);
          assert.equal(root.headers.get('x-rs-gps-read'),'v59');
          assert.equal(root.headers.get('x-rs-gps-compression'),'native-v59-apk');
          for(const marker of [
            '/assets/rider-spot-b227b31db568/app.mjs',
            '/rider-spot-native-day-v58.js',
            '/rider-spot-native-gps-safe-v46.js',
            'rider-spot-midnight-rollover-v57'
          ])assert.ok(home.includes(marker),'Missing '+marker);
          for(const [path,needle] of [
            ['/assets/rider-spot-b227b31db568/app.mjs','gpsArchiveV59'],
            ['/assets/rider-spot-b227b31db568/native-gps.js','__rsGPS42NativeRead'],
            ['/assets/rider-spot-b227b31db568/route-worker.mjs',''],
            ['/assets/rider-spot-33203ffb677c/app.mjs','gps_day_ranges'],
            ['/assets/rider-spot-82c20b027c23/app.mjs',''],
            ['/rider-spot-native-day-v58.js','allPointsForDay'],
            ['/rider-spot-native-gps-safe-v46.js','__rsGPS42NativeRead'],
            ['/sw.js','b227b31db568']
          ]){
            const {response,body}=await read(path);
            assert.equal(response.status,200,path);
            assert.ok(body.length>100,path+' empty');
            if(needle)assert.ok(body.includes(needle),'Missing '+needle+' in '+path);
            console.log('PASS',path,body.length);
          }
          // Verify the new GPS implementation did not alter ANY CSS design.
          for(const name of [
            'design-system.css','daily-timeline.css','weather-bar.css',
            'premium-shell.css','renewal-layout.css','curated-v9.css'
          ]){
            const v58=await read('/assets/rider-spot-33203ffb677c/'+name);
            const v59=await read('/assets/rider-spot-b227b31db568/'+name);
            assert.equal(v58.response.status,200,name+' v58');
            assert.equal(v59.response.status,200,name+' v59');
            assert.equal(v59.body,v58.body,'UI CSS changed: '+name);
          }
          const oauth=await read('/',{headers:{cookie:'rs_android_oauth='+'a'.repeat(32)}});
          assert.equal(oauth.response.status,200);
          assert.match(oauth.body,/riderspot-oauth:\/\/signin\/callback/);
          assert.equal((await read('/api/weather?lat=0&lon=0')).response.status,400);
          const head=await fetch(base+'/',{method:'HEAD',signal:AbortSignal.timeout(20000)});
          assert.equal(head.status,200);
          assert.equal((await head.text()).length,0);
          console.log('PASS production v59 + old v57/v58 + OAuth API + unchanged CSS and HEAD');
          NODE
