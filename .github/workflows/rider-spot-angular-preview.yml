name: Rider Spot angular PNG light UI candidate acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-angular-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_UI_URL: https://bd7338b3-rider-spot.jazzhjm.workers.dev/
      RIDER_SCREENSHOTS: /tmp/angular-ui-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci && npm run build && npm test
      - name: Confirm PNG bytes, light background style, service worker and map data
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const root=process.env.RIDER_UI_URL;
          const uri='/assets/maintenance/angular-parts-44febf5.png';
          const png=await fetch(new URL(uri,root));
          assert.equal(png.status,200,'PNG status');
          assert.match(png.headers.get('content-type')||'',/image\/png/);
          const live=Buffer.from(await png.arrayBuffer());
          const local=await readFile('src/assets/maintenance/angular-parts.png');
          assert.deepEqual(live,local,'image-generated PNG mismatch');
          assert.ok(live.subarray(0,8).equals(Buffer.from('89504e470d0a1a0a','hex')));
          const html=await (await fetch(root)).text();
          assert.match(html,/id="rs-angular-maintenance"/);
          assert.ok(html.includes(uri),'missing icon path in HTML');
          assert.ok(html.includes('rider-spot-ce520b450457/app.mjs'),'legacy app entry changed');
          const sw=await (await fetch(new URL('/sw.js',root))).text();
          assert.ok(sw.includes(uri),'PWA must pre-cache transparent PNG');
          assert.ok(sw.includes('rider-spot-shell-ce520b450457-angular'),'new PWA cache version required');
          const manifest=await fetch(new URL('/mapdata/manifest.json',root));
          assert.equal(manifest.status,200,'mapdata manifest');
          assert.ok((await manifest.json()).counts,'map data preserved');
          console.log('PASS angular transparent PNG assets, light UI style, PWA, mapdata');
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Synthetic mobile UI smoke - map, timeline, bike and native
        run: |
          sed -i 's/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/' tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
          node tests/ui-browser.cjs
      - name: Confirm PNG renders and maintenance forms still work
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const f='tests/mobile-records-browser.cjs';
          let s=fs.readFileSync(f,'utf8');
          const from='/data:image\\/png;base64,/';
          if(!s.includes(from))throw Error('PNG assertion not found for candidate');
          s=s.replace(from,'/angular-parts-44febf5\\.png/');
          s=s.replace('const origin="https://rider-spot.jazzhjm.workers.dev";',
            'const origin="https://bd7338b3-rider-spot.jazzhjm.workers.dev";');
          fs.writeFileSync(f,s);
          NODE
          node tests/mobile-records-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-angular-icons-white-ui
          path: |
            /tmp/angular-ui-check
            /tmp/rider-ui-evidence
          retention-days: 14
