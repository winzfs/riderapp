name: Rider Spot v4 native-first renewal release
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-renewal-v4-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-v4-release
  cancel-in-progress: false
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify compiled React has the v4 information architecture
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const release=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const app=fs.readFileSync('dist/assets/rider-spot-'+release.hash+'/app.mjs','utf8');
          const source=fs.readFileSync('src/finance-ui.mjs','utf8');
          const bike=fs.readFileSync('src/mobile-records.mjs','utf8');
          const visual=fs.readFileSync('src/visual-v2.css','utf8');
          assert.ok(source.indexOf('fin-chart-spotlight')<source.indexOf('fin-card fin-goal'));
          assert.ok(source.includes('fin-hero-main'));
          assert.ok(bike.includes('bike-vehicle-tools')&&bike.includes('showAllHistory?rows:rows.slice(0,3)'));
          for(const marker of ['fin-chart-spotlight','bike-vehicle-tools','rs-community-renewal','rs-renewal-route']){
            assert.ok(app.includes(marker),'Missing v4 React marker '+marker);
          }
          assert.ok(visual.includes('Native-first Renewal v4'));
          assert.ok(bike.includes('showAllHistory?rows:rows.slice(0,3)'));
          console.log('Bike history default collapsed; full records remain accessible by expand control');
          assert.ok(fs.readFileSync('dist/assets/rider-spot-'+release.hash+'/renewal-layout.css','utf8').includes('fin-hero-renewal'));
          const html=fs.readFileSync('dist/index.html','utf8');
          assert.ok(html.includes('rider-spot-'+release.hash+'/app.mjs'));
          assert.ok(fs.readFileSync('src/renewal-layout.css','utf8').includes('--rs-text:#173D3C'));
          console.log('RENEWAL_V4_BUILD_PASS',release.hash,app.length);
          NODE
      - name: Preserve no-reload, GPS, WebView and update safety checks
        run: |
          mkdir -p /tmp/renewal-v4-native
          tar -xJf ../rider-spot-android/source.tar.xz -C /tmp/renewal-v4-native
          RIDER_ANDROID_SOURCE=/tmp/renewal-v4-native node scripts/check-update-safety.mjs
      - run: npx playwright install --with-deps chromium
      - name: Smoke test compiled candidate in mobile browser and Android bridge
        run: |
          python3 -m http.server 8840 --directory dist >/tmp/rider-v4-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8840/ >/dev/null; then break; fi
            sleep 1
          done
          RIDER_TEST_ORIGIN=http://127.0.0.1:8840 RIDER_SCREENSHOTS=/tmp/rider-v4-shots node tests/mobile-records-browser.cjs
          RIDER_TEST_URL=http://127.0.0.1:8840 RIDER_TEST_CASE=native RIDER_APK_BRIDGE=/tmp/renewal-v4-native/app/src/main/assets/native-bridge.js node tests/browser.cjs
      - name: Freeze fully verified assets for immutable KV publishing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const release=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const dir='dist/assets/rider-spot-'+release.hash;
          const names=['app.mjs','route-worker.mjs','native-gps.js','map-reports.js','design-system.css','workspace-tools.js','tab-resume.js','daily-timeline.css','weather-bar.js','weather-bar.css','premium-shell.css','renewal-layout.css'];
          for(const name of names)fs.copyFileSync(path.join(dir,name),path.join('prebuilt',name));
          for(const name of ['index.html','sw.js','release.json'])fs.copyFileSync(path.join('dist',name),path.join('prebuilt',name));
          console.log('V4_FROZEN',release.hash,names.length+3);
          NODE
      - name: Commit immutable candidate into the project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-web/prebuilt
          if ! git diff --cached --quiet; then
            git commit -m 'build: freeze verified native-first v4 UI assets [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-v4-renewal-evidence
          path: |
            rider-spot-web/dist/release.json
            /tmp/rider-v4-shots
          retention-days: 7
          if-no-files-found: warn
