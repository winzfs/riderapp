name: Rider Spot per-part cycle v186 production smoke
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-bike-cycles-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify deployed main resources, per-part editor and preserved map
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://rider-spot.jazzhjm.workers.dev',hash='61e324cbf937';
          assert.equal(JSON.parse(fs.readFileSync('prebuilt/release.json','utf8')).hash,hash);
          for(const [path,file] of [['/','index.html'],['/sw.js','sw.js'],...['app.mjs','design-system.css'].map(n=>['/assets/rider-spot-'+hash+'/'+n,n])]){
            const r=await fetch(base+path,{headers:{'Cache-Control':'no-cache'}});
            assert.equal(r.status,200,path+' HTTP '+r.status);
            const content=await r.text();
            assert.equal(content,fs.readFileSync('prebuilt/'+file,'utf8'),'live production does not match validated artifact '+path);
            if(file==='app.mjs')assert.ok(content.includes('record-cycle-save')&&content.includes('data:image/png;base64,'));
            if(file==='design-system.css')assert.ok(content.includes('.record-cycle-panel'));
            console.log('PASS live',path,content.length);
          }
          for(const path of ['/assets/rider-spot-'+hash+'/route-worker.mjs','/assets/rider-spot-'+hash+'/native-gps.js','/mapdata/manifest.json']){
            const r=await fetch(base+path);assert.equal(r.status,200,path);
            if(path.includes('manifest'))assert.ok((await r.json()).counts);
          }
          console.log('PASS live native bridge and map assets');
          NODE
