name: Rider Spot finance integration & verified build
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-finance-release.yml'
      - 'rider-spot-web/src/finance-model.mjs'
      - 'rider-spot-web/src/finance-ui.mjs'
      - 'rider-spot-web/src/application.mjs'
      - 'rider-spot-web/src/navigation.mjs'
      - 'rider-spot-web/src/mobile-records.mjs'
      - 'rider-spot-web/src/design-system.css'
      - 'rider-spot-web/tests/finance-model.test.mjs'
      - 'rider-spot-web/tests/mobile-records-browser.cjs'
      - 'rider-spot-web/tests/ui-browser.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-finance-release
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify five navigation tabs, income editor, and existing bike flows
        env:
          RIDER_TEST_ORIGIN: http://127.0.0.1:8840
          RIDER_SCREENSHOTS: /tmp/rider-finance-browser
        run: |
          python3 -m http.server 8840 --directory dist > /tmp/rider-finance-http.log 2>&1 &
          node tests/mobile-records-browser.cjs
      - name: Freeze verified release without replacing original Neo-Flat graphics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const rel=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          assert.match(rel.hash,/^[a-f0-9]{12}$/);
          const base='dist/assets/rider-spot-'+rel.hash+'/';
          const app=fs.readFileSync(base+'app.mjs','utf8');
          const css=fs.readFileSync(base+'design-system.css','utf8');
          for(const phrase of ['neo-flat-original-v197','data:image/webp;base64,','finance-page','rider_extra_expenses','rider_finance_goals']) {
            assert.ok(app.includes(phrase)||css.includes(phrase), 'missing '+phrase);
          }
          assert.ok(css.includes('repeat(5,minmax(0,1fr))'));
          for(const name of ['app.mjs','route-worker.mjs','native-gps.js','map-reports.js',
            'design-system.css','workspace-tools.js','tab-resume.js','daily-timeline.css']){
            fs.copyFileSync(base+name,'prebuilt/'+name);
          }
          for(const name of ['index.html','sw.js','release.json'])
            fs.copyFileSync('dist/'+name,'prebuilt/'+name);
          console.log('VERIFIED FINANCE BUILD',rel.hash);
          NODE
      - name: Persist verified build for Cloudflare deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt
          if ! git diff --cached --quiet; then
            git commit -m 'build: freeze tested five-tab finance release [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-finance-verified
          path: |
            rider-spot-web/dist/release.json
            rider-spot-web/prebuilt/release.json
            /tmp/rider-finance-browser
          retention-days: 7
