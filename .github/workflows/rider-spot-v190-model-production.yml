name: Rider Spot v190 model catalog production verification
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v190-model-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify deployed v190 HTML, JS, CSS and model picker resources byte for byte
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root='https://rider-spot.jazzhjm.workers.dev',hash='d64740406cbc';
          const manifest=JSON.parse(fs.readFileSync('prebuilt/release.json','utf8'));
          assert.equal(manifest.hash,hash,'wrong catalog release hash');
          for(const [url,name] of [['/','index.html'],['/sw.js','sw.js'],
            ...['app.mjs','design-system.css','tab-resume.js','native-gps.js','workspace-tools.js','daily-timeline.css'].map(f=>
              ['/assets/rider-spot-'+hash+'/'+f,f])]){
            const r=await fetch(root+url,{headers:{'Cache-Control':'no-cache'}});
            assert.equal(r.status,200,url+' HTTP status');
            const actual=await r.text(),expected=fs.readFileSync('prebuilt/'+name,'utf8');
            assert.equal(actual,expected,url+' does not match audited v190 bundle');
            if(name==='app.mjs'){
              assert.ok(actual.includes('rider_model_maintenance_settings')&&
                actual.includes('bike-model-picker')&&actual.includes('model_key')&&
                actual.includes('PCX125 (2021~)')&&actual.includes('NMAX125'),
                'catalog or user maintenance overrides absent from live app');
            }
            if(name==='design-system.css')assert.ok(actual.includes('bike-model-picker'),
              'model list styles missing from live CSS');
            console.log('PASS live v190',url);
          }
          const r=await fetch(root+'/mapdata/manifest.json');
          assert.equal(r.status,200,'existing map data missing');
          assert.ok((await r.json()).counts,'existing public POI manifest must be preserved');
          console.log('PASS prior map information');
          NODE
      - run: npm ci && npm run build && npm test
      - name: Assert bundled catalog and model defaults on both Android phone widths
        run: |
          npx playwright install --with-deps chromium
          node tests/mobile-records-browser.cjs
