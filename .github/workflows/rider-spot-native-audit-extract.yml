name: Rider Spot extract native lifecycle for reload audit
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-native-audit-extract.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - name: Inspect and extract already committed Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rider-native-audit rider-spot-android/audit
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rider-native-audit
          cp /tmp/rider-native-audit/app/src/main/java/com/riderspot/android/MainActivity.java rider-spot-android/audit/MainActivity.java.txt
          cp /tmp/rider-native-audit/app/src/main/assets/native-bridge.js rider-spot-android/audit/native-bridge.js.txt
          cp /tmp/rider-native-audit/app/src/main/AndroidManifest.xml rider-spot-android/audit/AndroidManifest.xml.txt
          cp /tmp/rider-native-audit/app/build.gradle rider-spot-android/audit/build.gradle.txt
          grep -RnE 'loadUrl|\.reload\(|onRenderProcessGone|onConfigurationChanged|onResume|onNewIntent|shouldOverrideUrlLoading' /tmp/rider-native-audit/app/src/main/java/com/riderspot/android | head -100 || true
      - name: Commit source-only audit artifacts
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rider-spot-android/audit
          if ! git diff --cached --quiet; then
            git commit -m 'chore(debug): extract archived native WebView lifecycle and bridge for audit [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
