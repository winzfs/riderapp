name: Rider Spot isolated static preview HTTP acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-static-http-qa.yml'
      - 'rider-spot-web/scripts/verify-static-preview.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-isolated-http-qa
  cancel-in-progress: false
jobs:
  public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - name: Checkout current candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated Cloudflare preview and capture failure details
        id: smoke
        continue-on-error: true
        run: node scripts/verify-static-preview.mjs
      - name: Publish test evidence back to the repository
        if: always()
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-web/docs/static-preview-qa.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: record isolated static preview QA [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
      - name: Fail acceptance if any preview check failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
