name: Rider Spot UI acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - 'rider-spot-web/src/**'
      - 'rider-spot-web/tests/ui-browser.cjs'
      - '.github/workflows/rider-spot-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - name: Capture unchanged production baseline
        env:
          RIDER_UI_URL: https://rider-spot.jazzhjm.workers.dev/
          RIDER_UI_BASELINE: '1'
        run: node tests/ui-browser.cjs
      - name: Mobile UI, replay, map, data preservation and simulated WebView
        env:
          RIDER_UI_URL: https://urban-ui-rider-spot.jazzhjm.workers.dev/
        run: node tests/ui-browser.cjs
      - name: Native bridge capture and offline completion regression
        env:
          RIDER_TEST_URL: https://urban-ui-rider-spot.jazzhjm.workers.dev/
          RIDER_TEST_CASE: native
          RIDER_APK_BRIDGE: /tmp/rider-apk/app/src/main/assets/native-bridge.js
        run: |
          mkdir -p /tmp/rider-apk
          tar -xf ../rider-spot-android/source.tar.xz -C /tmp/rider-apk
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-ui-evidence
          path: /tmp/rider-ui-evidence
          retention-days: 14
