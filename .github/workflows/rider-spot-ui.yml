name: Rider Spot UI acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - 'rider-spot-web/src/**'
      - 'rider-spot-web/tests/ui-browser.cjs'
      - '.github/workflows/rider-spot-ui.yml'
  workflow_dispatch:
concurrency:
  group: rider-spot-ui-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mobile-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      # QA-only location data: do not place a test facility under the synthetic GPS marker.
      - name: Offset synthetic QA facility from synthetic rider
        run: |
          sed -i "s/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/" tests/ui-browser.cjs
          # documentElement is not available during Playwright addInitScript execution.
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
      - name: Start locally rebuilt v61 UI against unchanged Worker APIs
        run: |
          node scripts/local-preview.cjs >/tmp/rider-local-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8789/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8789/ | grep -q 'rider-spot-'
      - name: Mobile UI, replay, map, data preservation and simulated WebView
        env:
          RIDER_UI_URL: http://127.0.0.1:8789/
        run: node tests/ui-browser.cjs
      - name: Native bridge capture and offline completion regression
        env:
          RIDER_TEST_URL: http://127.0.0.1:8789/
          RIDER_TEST_CASE: native
          RIDER_APK_BRIDGE: /tmp/rider-apk/app/src/main/assets/native-bridge.js
        run: |
          mkdir -p /tmp/rider-apk
          tar -xf ../rider-spot-android/source.tar.xz -C /tmp/rider-apk
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-ui-evidence
          path: /tmp/rider-ui-evidence
          retention-days: 14
