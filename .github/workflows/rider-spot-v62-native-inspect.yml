name: Rider Spot v62 Native Inspect
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v62-native-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android source without modifying archive
        run: |
          mkdir -p /tmp/rs62-native
          tar -xf rider-spot-android/source.tar.xz -C /tmp/rs62-native
          find /tmp/rs62-native -type f | head -80
          echo '==== INSETS / WEBVIEW CONFIG SEARCH ===='
          grep -R -n -E 'WindowInsets|decorFitsSystemWindows|setDecorFits|setOnApplyWindowInsets|setStatusBarColor|setNavigationBarColor|LAYOUT_FULLSCREEN|SYSTEM_UI_FLAG|targetSdk|edgeToEdge|viewport-fit|setWebViewClient|setContentView' /tmp/rs62-native/app/src /tmp/rs62-native/app/build.gradle* /tmp/rs62-native/gradle* 2>/dev/null | head -110 || true
          echo '==== MANIFEST / GRADLE / MAIN ACTIVITY ===='
          for f in $(find /tmp/rs62-native/app/src -type f \( -name 'MainActivity.java' -o -name 'MainActivity.kt' -o -name 'AndroidManifest.xml' \) | head -10); do echo "==== $f"; sed -n '1,260p' "$f"; done
          echo '==== BUILD CONFIG ===='
          cat /tmp/rs62-native/app/build.gradle* | head -150
      - uses: actions/upload-artifact@v4
        with:
          name: rider-spot-v62-native-audit
          path: /tmp/rs62-native
          retention-days: 7
