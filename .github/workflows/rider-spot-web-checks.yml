name: Rider Spot Web Checks
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - 'rider-spot-web/**'
      - '.github/workflows/rider-spot-web-checks.yml'
  workflow_dispatch:
concurrency:
  group: rider-spot-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  validate-webview-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - name: Build production web bundle
        run: npm run build
      - name: Check GPS and tab navigation regression tests
        run: npm test
      - name: Restore native APK source for release safety gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rider-spot-staging-native
          tar -xJf ../rider-spot-android/source.tar.xz -C /tmp/rider-spot-staging-native
          test -s /tmp/rider-spot-staging-native/app/src/main/assets/native-bridge.js
      - name: Block release staging if old GPS recovery or forced reload returns
        env:
          RIDER_ANDROID_SOURCE: /tmp/rider-spot-staging-native
        run: |
          node --test /tmp/rider-spot-staging-native/tests/*.test.cjs
          node scripts/check-update-safety.mjs
      - name: Verify tab recovery is in the production bundle
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/release.json', 'utf8'));
          const base = '/assets/rider-spot-' + manifest.hash + '/';
          const src = base + 'tab-resume.js';
          const css = base + 'daily-timeline.css';
          const html = readFileSync('dist/index.html', 'utf8');
          const sw = readFileSync('dist/sw.js', 'utf8');
          if (!manifest.files.includes(src) || !html.includes(src) || !sw.includes(src))
            throw Error('Tab recovery missing from HTML, Worker asset list or service worker');
          if (!manifest.files.includes(css) || !html.includes(css) || !sw.includes(css))
            throw Error('Daily timeline stylesheet missing from release');
          if (html.includes('native-light-map.css') || sw.includes('native-light-map.css'))
            throw Error('Rejected fake raster filter must not ship');
          console.log('PASS bundled navigation recovery and daily timeline CSS: ' + manifest.hash);
          NODE
      - name: Stage validated release assets for Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prebuilt
          cp dist/index.html prebuilt/index.html
          cp dist/sw.js prebuilt/sw.js
          cp dist/release.json prebuilt/release.json
          bundle_dir="dist/assets/rider-spot-$(node -p "require('./dist/release.json').hash")"
          test -s "$bundle_dir/app.mjs"
          for name in app.mjs route-worker.mjs native-gps.js map-reports.js tab-resume.js daily-timeline.css design-system.css workspace-tools.js weather-bar.js weather-bar.css; do
            cp "$bundle_dir/$name" "prebuilt/$name"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f prebuilt/native-light-map.css
          git add -f -A prebuilt/
          if ! git diff --cached --quiet; then
            git fetch origin feature/rider-spot-native-apk
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feature/rider-spot-native-apk)" ]]; then
              echo "Branch advanced during CI. Skip stale prebuilt assets."
              exit 0
            fi
            git commit -m "chore(web): stage tested v61 release [skip ci]"
            if ! git push origin HEAD:feature/rider-spot-native-apk; then
              echo "Another commit arrived during staging; leaving release assets intact for the next validation."
              exit 0
            fi
          fi
