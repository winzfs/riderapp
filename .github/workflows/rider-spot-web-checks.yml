name: Rider Spot Web Checks
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - 'rider-spot-web/**'
      - '.github/workflows/rider-spot-web-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-webview-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - name: Build production web bundle
        run: npm run build
      - name: Check GPS and tab navigation regression tests
        run: npm test
      - name: Verify tab recovery is in the production bundle
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/release.json', 'utf8'));
          const src = '/assets/rider-spot-' + manifest.hash + '/tab-resume.js';
          const html = readFileSync('dist/index.html', 'utf8');
          const sw = readFileSync('dist/sw.js', 'utf8');
          if (!manifest.files.includes(src) || !html.includes(src) || !sw.includes(src))
            throw Error('Tab recovery missing from HTML, Worker asset list or service worker');
          console.log('PASS bundled navigation recovery: ' + src);
          NODE
