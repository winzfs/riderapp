name: Rider Spot v61 staged Worker acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-v61-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-133-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated QA location fixture
        run: |
          sed -i "s/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/" tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
      - name: Verify uploaded Cloudflare v61 release at mobile sizes
        env:
          RIDER_UI_URL: https://113bdc52-rider-spot.jazzhjm.workers.dev/
        run: node tests/ui-browser.cjs
      - name: Verify uploaded Cloudflare v61 release with native bridge and offline storage
        env:
          RIDER_TEST_URL: https://113bdc52-rider-spot.jazzhjm.workers.dev/
          RIDER_TEST_CASE: native
          RIDER_APK_BRIDGE: /tmp/rider-apk/app/src/main/assets/native-bridge.js
        run: |
          mkdir -p /tmp/rider-apk
          tar -xf ../rider-spot-android/source.tar.xz -C /tmp/rider-apk
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-v61-live-evidence
          path: /tmp/rider-ui-evidence
          retention-days: 14
