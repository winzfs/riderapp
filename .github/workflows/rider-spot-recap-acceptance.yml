name: Rider Spot ride recap PNG and isolated preview acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-recap-acceptance.yml'
      - 'rider-spot-web/src/ride-recap.mjs'
      - 'rider-spot-web/src/daily-timeline.css'
      - 'rider-spot-web/src/ride-recap-map.mjs'
      - 'rider-spot-web/src/Timeline.mjs'
      - 'rider-spot-web/src/finance-ui.mjs'
      - 'rider-spot-web/tests/ride-recap-browser.cjs'
      - 'rider-spot-web/tests/ride-recap-dialog-browser.cjs'
      - 'rider-spot-web/tests/ride-recap-map.test.mjs'
      - 'rider-spot-web/tests/ride-recap.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-png:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Export actual 1080px PNG in Chromium, no fake route or duplicate cost
        run: node tests/ride-recap-browser.cjs
      - name: Verify top-layer dialog, always-visible actions and fixed options
        run: |
          node scripts/local-preview.cjs >/tmp/rider-recap-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8789/ >/dev/null && break
            sleep 1
          done
          node tests/ride-recap-dialog-browser.cjs
      - name: Assert immutable output and native WebView safe startup
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const root='dist/assets/rider-spot-'+r.hash+'/';
          const js=fs.readFileSync(root+'app.mjs','utf8');
          const css=fs.readFileSync(root+'daily-timeline.css','utf8');
          const source=fs.readFileSync('src/ride-recap.mjs','utf8');
          for(const word of ['타임라인','라이더스팟','주행 경로']) {
            assert.ok(source.includes(word),'Korean poster text missing: '+word);
          }
          for(const key of ['rs-recap-timeline-action','rs-recap-sheet','rs-recap-launch']) {
            assert.ok(js.includes(key)||css.includes(key),'Missing recap element '+key);
          }
          console.log('RECAP_BUNDLE_PASS',r.hash);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-recap-visual-qa
          path: /tmp/rider-spot-recap
          retention-days: 7
          if-no-files-found: warn
  preview-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check independent preview HTTP release and old client compatibility
        env:
          ORIGIN: https://rider-spot-recap-preview.jazzhjm.workers.dev
        run: |
          python3 - <<'PY'
          import urllib.request,time
          origin='https://rider-spot-recap-preview.jazzhjm.workers.dev'
          for i in range(4):
            try:
              with urllib.request.urlopen(urllib.request.Request(origin+'/',headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36','Accept':'text/html,*/*'}),timeout=25) as r:
                html=r.read().decode()
                assert r.status==200
              assert 'afe0e2f75761/app.mjs' in html,'Preview not on new recap release'
              assert 'rs-recovery-guard-v217' in html,'Native recovery guard missing'
              for path in ['/sw.js','/assets/rider-spot-afe0e2f75761/app.mjs','/assets/rider-spot-afe0e2f75761/daily-timeline.css','/assets/rider-spot-7b68a77eb20f/app.mjs','/assets/rider-spot-11cf61e8a1ba/app.mjs','/assets/rider-spot-78cfb498ffed/app.mjs']:
                with urllib.request.urlopen(urllib.request.Request(origin+path,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36','Accept':'*/*'}),timeout=40) as r:
                  assert r.status==200,(path,r.status)
                  assert len(r.read())>300,path
              print('RECAP_PREVIEW_HTTP_PASS',len(html))
              break
            except Exception as e:
              print('Preview check',i+1,str(e))
              if i==3:raise
              time.sleep(3)
          PY
