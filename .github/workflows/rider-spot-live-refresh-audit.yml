name: Rider Spot audit live refresh and weather code
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-live-refresh-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-live-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shipped code and compare weather source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const origin='https://rider-spot.jazzhjm.workers.dev';
          const text=async p=>{const r=await fetch(origin+p,{headers:{'Cache-Control':'no-store'}});const t=await r.text();return {t,status:r.status,headers:Object.fromEntries(r.headers.entries())}};
          const html=(await text('/')).t;
          const scripts=[...new Set([...html.matchAll(/\bsrc="(\/[^"]+\.(?:js|mjs)(?:\?[^"]*)?)"/g)].map(m=>m[1].split('?')[0]))];
          for(const path of ['/pwa-init.js','/sw.js',...scripts]){
            try {
              const {t,status}=await text(path);
              const patterns=[/location\.reload\s*\(/g,/location\.replace\s*\(/g,/\b(?:window|document)\.location(?:\.href)?\s*=/g,/\b(?:window|document)\.location\.href\b/g,/controllerchange/g,/skipWaiting/g,/clients\.claim/g,/MutationObserver/g,/setInterval\s*\(/g];
              const hits=[];
              for(const rx of patterns) {
                for(const m of t.matchAll(rx)) {
                  hits.push({pattern:rx.source,offset:m.index,code:t.slice(Math.max(0,m.index-80),m.index+140)});
                  if(hits.length>=45)break;
                }
                if(hits.length>=45)break;
              }
              const digest=createHash('sha256').update(t).digest('hex').slice(0,16);
              console.log('SCRIPT',JSON.stringify({path,status,bytes:t.length,sha256:digest,hits}).slice(0,10000));
              if(/weather-bar\.js$/.test(path)){
                const local=readFileSync('rider-spot-web/src/weather-bar.js','utf8');
                const same=local===t;
                console.log('WEATHER_SAME_AS_SOURCE',same,'sourceBytes',local.length,'liveBytes',t.length);
                console.log('WEATHER_LIVE_END',t.slice(-900));
              }
            }catch(e){console.log('ERROR',path,e.message)}
          }
          NODE
