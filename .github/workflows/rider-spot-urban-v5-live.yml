name: Rider Spot Urban v5 LIVE UI and record acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-urban-v5-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_ORIGIN: https://rider-spot.jazzhjm.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Real production hash, native guard, v5 CSS and v4 client compatibility
        run: |
          set -euo pipefail
          curl --fail --retry 3 --retry-delay 2 -sSL "$RIDER_ORIGIN/" > /tmp/rider-v5-live.html
          curl --fail --retry 3 --retry-delay 2 -sSL "$RIDER_ORIGIN/sw.js" > /tmp/rider-v5-live-sw.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const release=JSON.parse(fs.readFileSync('prebuilt/release.json','utf8'));
          const html=fs.readFileSync('/tmp/rider-v5-live.html','utf8');
          const sw=fs.readFileSync('/tmp/rider-v5-live-sw.js','utf8');
          assert.equal(release.hash,'3305352a56bc');
          assert.ok(html.includes('rs-recovery-guard-v217'),'native recovery guard');
          assert.ok(html.includes('/assets/rider-spot-'+release.hash+'/app.mjs'),'v5 compiled app');
          assert.ok(html.includes('/assets/rider-spot-'+release.hash+'/urban-editorial-v5.css'),'v5 hashed style');
          assert.ok(html.includes('rev=20261121-v5'),'v5 isolated last layer');
          assert.ok(sw.includes('rider-spot-shell-'+release.hash),'service worker must use matching hash');
          const files=release.files.filter(f=>f.startsWith('/assets/'));
          assert.equal(files.length,13);
          for(const file of files){
            const r=await fetch(process.env.RIDER_ORIGIN+file,{signal:AbortSignal.timeout(45000)});
            assert.equal(r.status,200,file+' HTTP '+r.status);
            assert.equal(r.headers.get('x-rs-release'),release.hash);
            assert.ok((await r.arrayBuffer()).byteLength>100);
          }
          const css=await fetch(process.env.RIDER_ORIGIN+'/rider-spot-visual-v2-20261121.css?rev=20261121-v5',{signal:AbortSignal.timeout(30000)});
          assert.equal(css.status,200);
          assert.equal(css.headers.get('x-rs-design'),'urban-v5-20261121');
          assert.ok((await css.text()).includes('URBAN EDITORIAL v5'));
          const prior=await fetch(process.env.RIDER_ORIGIN+'/assets/rider-spot-8eb44596629f/app.mjs',{signal:AbortSignal.timeout(45000)});
          assert.equal(prior.status,200,'running clients must retain old hashed JS');
          console.log('URBAN_V5_PRODUCTION_ASSETS_PASS',release.hash);
          NODE
      - run: npx playwright install chromium
      - name: Five-tab responsive live screenshot, navigation, overflow and reload test
        env:
          RIDER_VISUAL_URL: https://rider-spot.jazzhjm.workers.dev
        run: node tests/urban-v5-browser.cjs
      - name: Synthetic login, finance & maintenance CRUD, back navigation
        env:
          RIDER_TEST_ORIGIN: https://rider-spot.jazzhjm.workers.dev
          RIDER_TEST_REMOTE_SOURCE: '1'
          RIDER_SCREENSHOTS: /tmp/rider-urban-v5-live-records
        run: node tests/mobile-records-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-urban-v5-LIVE-screens
          path: |
            /tmp/rider-spot-urban-v5
            /tmp/rider-urban-v5-live-records
          retention-days: 7
          if-no-files-found: warn
