name: Rider Spot maintenance v179 candidate acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-maintenance-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_UI_URL: https://31944d0b-rider-spot.jazzhjm.workers.dev/
      RIDER_SCREENSHOTS: /tmp/rider-maintenance-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - name: Confirm exact uploaded candidate and preserved map/API assets
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = process.env.RIDER_UI_URL;
          const hash = '3b663341cf1c';
          const paths = ['/', '/sw.js',
            '/assets/rider-spot-'+hash+'/app.mjs',
            '/assets/rider-spot-'+hash+'/design-system.css',
            '/assets/rider-spot-'+hash+'/workspace-tools.js',
            '/mapdata/manifest.json'];
          const texts = {};
          for (const path of paths) {
            const res = await fetch(new URL(path, base));
            assert.equal(res.status, 200, path+' HTTP '+res.status);
            texts[path] = await res.text();
            assert.ok(texts[path].length > 100, path+' empty');
            console.log('PASS preview', path, res.status, texts[path].length);
          }
          assert.ok(texts['/'].includes('/assets/rider-spot-'+hash+'/app.mjs'));
          assert.ok(texts['/'].includes('/assets/rider-spot-'+hash+'/design-system.css'));
          assert.ok(texts['/sw.js'].includes('/assets/rider-spot-'+hash+'/app.mjs'));
          assert.ok(texts['/assets/rider-spot-'+hash+'/app.mjs'].includes('record-detail-summary'));
          assert.ok(texts['/assets/rider-spot-'+hash+'/design-system.css'].includes('record-parts-grid'));
          assert.ok(JSON.parse(texts['/mapdata/manifest.json']).counts);
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance of actual preview at 320, 360, 390, 412 and 768 widths
        run: |
          sed -i 's/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/' tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
          node tests/ui-browser.cjs
          node tests/journey-browser.cjs
      - name: Synthetic maintenance save, edit, back and cost QA
        run: node tests/mobile-records-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-maintenance-v179-preview-screens
          path: |
            /tmp/rider-ui-evidence
            /tmp/rider-journey-evidence
            /tmp/rider-maintenance-evidence
          retention-days: 14
