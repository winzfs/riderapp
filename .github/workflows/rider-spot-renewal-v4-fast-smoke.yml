name: Rider Spot v4 fast staged WebView acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-renewal-v4-fast-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install browser without OS package upgrades
        run: npx playwright install chromium
      - name: Preview five-tab swipe/scroll/reload acceptance
        env:
          RIDER_VISUAL_URL: https://rider-spot-renewal-preview.jazzhjm.workers.dev
        run: node tests/visual-v2-browser.cjs
      - name: Preview authenticated synthetic finance, maintenance, timeline CRUD
        env:
          RIDER_TEST_ORIGIN: https://rider-spot-renewal-preview.jazzhjm.workers.dev
          RIDER_TEST_REMOTE_SOURCE: '1'
          RIDER_SCREENSHOTS: /tmp/rider-v4-fast-preview
        run: node tests/mobile-records-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-v4-fast-staged-screenshots
          path: |
            /tmp/rider-spot-visual-v2
            /tmp/rider-v4-fast-preview
          retention-days: 7
          if-no-files-found: warn
