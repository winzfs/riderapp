name: Rider Spot isolated static preview browser acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-static-browser-qa.yml'
      - 'rider-spot-web/tests/static-preview-browser.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-static-browser-qa
  cancel-in-progress: false
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke-check new isolated Cloudflare preview on mobile
        id: mobile
        continue-on-error: true
        run: node tests/static-preview-browser.cjs
      - name: Persist test evidence
        if: always()
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-web/docs/static-preview-browser-qa.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: record isolated mobile preview acceptance [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-static-preview-screenshots
          path: /tmp/rider-static-preview-*.png
          retention-days: 7
      - name: Fail if mobile smoke detected regression
        if: steps.mobile.outcome != 'success'
        run: exit 1
