name: Rider Spot v220 production smoke after premium release
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v220-production-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - name: Compare production HTTP to verified v220 release bytes and legacy APIs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const origin='https://rider-spot.jazzhjm.workers.dev',hash='06a4d2f6010a';
          const get=async path=>{const r=await fetch(origin+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(30000)});assert.equal(r.status,200,path+': HTTP '+r.status);return r.text()};
          const html=await get('/');
          assert.ok(html.includes(hash+'/app.mjs')&&html.includes(hash+'/premium-shell.css'),'v220 HTML missing');
          assert.ok(html.includes('rs-recovery-guard-v217'),'v217 native trip guard missing');
          assert.equal(html.replace(/<script id="rs-recovery-guard-v217">[\s\S]*?<\/script>/,''),fs.readFileSync('prebuilt/index.html','utf8'));
          const sw=await get('/sw.js');
          assert.equal(sw,fs.readFileSync('prebuilt/sw.js','utf8'));
          for(const n of ['app.mjs','native-gps.js','premium-shell.css','design-system.css','daily-timeline.css','weather-bar.js','weather-bar.css']){
            const path='/assets/rider-spot-'+hash+'/'+n;
            assert.equal(await get(path),fs.readFileSync('prebuilt/'+n,'utf8'),path+' release bytes mismatch');
          }
          for(const path of ['/rider-spot-shell-v40.js','/rider-maintenance-v40-teal-defaults.js','/rider-finance-v23-b4471aa90f1e.js','/mapdata/manifest.json']){
            assert.ok((await get(path)).length>100,'legacy missing: '+path);
          }
          console.log('PASS production v220 verified assets and previous API/map data');
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Live Android-size tab and document-reload smoke
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const width of [320,393,412]){
                const ctx=await b.newContext({viewport:{width,height:844},isMobile:true,hasTouch:true,timezoneId:'Asia/Seoul',serviceWorkers:'block',permissions:['geolocation'],geolocation:{latitude:35.17,longitude:126.83}});
                await ctx.addInitScript(()=>{if(window===window.top){const k='__rider_prod_qa_boots';sessionStorage.setItem(k,String(Number(sessionStorage.getItem(k)||0)+1));}});
                const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.goto('https://rider-spot.jazzhjm.workers.dev/',{waitUntil:'domcontentloaded',timeout:35000});
                const nav=page.locator('.bottom-nav button');await nav.first().waitFor({timeout:35000});
                assert.equal(await nav.count(),5);
                assert.equal(await page.locator('link[href*="premium-shell.css"]').count(),1);
                for(const index of [1,2,3,4,0]){
                  await nav.nth(index).click();await page.waitForTimeout(250);
                  const d=await page.evaluate(()=>({doc:document.documentElement.scrollWidth,body:document.body.scrollWidth}));
                  assert.ok(d.doc<=width+2&&d.body<=width+2,'horizontal overflow '+width+': '+JSON.stringify(d));
                }
                await page.waitForTimeout(1400);
                assert.equal(await page.evaluate(()=>Number(sessionStorage.getItem('__rider_prod_qa_boots'))),1,'full reload '+width);
                assert.deepEqual(errors,[],'browser JS error '+width);
                console.log('PASS production v220 responsive nav, no reload',width);
                await ctx.close();
              }
            }finally{await b.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
