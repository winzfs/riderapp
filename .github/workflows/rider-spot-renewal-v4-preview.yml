name: Rider Spot v4 isolated preview acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-renewal-v4-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_PREVIEW: https://rider-spot-renewal-preview.jazzhjm.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - name: Prewarm immutable v4 bundle and verify original recovery guard
        run: |
          set -euo pipefail
          curl --fail --retry 3 --retry-delay 2 -sSL "$RIDER_PREVIEW/" > /tmp/v4-preview.html
          curl --fail --retry 3 --retry-delay 2 -sSL "$RIDER_PREVIEW/sw.js" > /tmp/v4-preview-sw.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html=fs.readFileSync('/tmp/v4-preview.html','utf8');
          const sw=fs.readFileSync('/tmp/v4-preview-sw.js','utf8');
          const release=JSON.parse(fs.readFileSync('prebuilt/release.json','utf8'));
          assert.equal(release.hash,'8eb44596629f');
          assert.ok(html.includes('rs-recovery-guard-v217'),'native v217 recovery guard');
          assert.ok(html.includes('/assets/rider-spot-'+release.hash+'/app.mjs'),'new React bundle present');
          assert.ok(html.includes('renewal-layout.css'),'v4 CSS bundled');
          assert.ok(html.includes('rev=20261121-v4'),'v4 design overlay linked');
          assert.ok(sw.includes('rider-spot-shell-'+release.hash),'new immutable SW');
          console.log('V4_HTML_PASS',release.hash);
          for(const path of release.files.filter(path=>path.startsWith('/assets/'))){
            const response=await fetch(process.env.RIDER_PREVIEW+path,{signal:AbortSignal.timeout(45000)});
            assert.equal(response.status,200,path+' HTTP '+response.status);
            const bytes=await response.arrayBuffer();
            assert.ok(bytes.byteLength>300,path+' too short');
            assert.equal(response.headers.get('x-rs-release'),release.hash,path+' wrong gateway');
            console.log('V4_ASSET_PASS',path,bytes.byteLength);
          }
          const css=await fetch(process.env.RIDER_PREVIEW+'/rider-spot-visual-v2-20261121.css?rev=20261121-v4');
          assert.equal(css.status,200);
          const text=await css.text();
          assert.ok(text.includes('Native-first Renewal v4'),'CSS overlay mismatch');
          console.log('V4_STYLE_PASS');
          NODE
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile 320/393/412 live preview 5-tab reload and overflow checks
        env:
          RIDER_VISUAL_URL: https://rider-spot-renewal-preview.jazzhjm.workers.dev
        run: node tests/visual-v2-browser.cjs
      - name: Auth-mocked finance, maintenance and timeline CRUD checks on preview
        env:
          RIDER_TEST_ORIGIN: https://rider-spot-renewal-preview.jazzhjm.workers.dev
          RIDER_SCREENSHOTS: /tmp/rider-v4-preview-fixtures
        run: node tests/mobile-records-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-v4-preview-acceptance
          path: |
            /tmp/rider-spot-visual-v2
            /tmp/rider-v4-preview-fixtures
          retention-days: 7
          if-no-files-found: warn
