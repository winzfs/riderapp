name: Rider Spot KV static bundle integrity acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-kv-bundle-qa.yml'
      - 'rider-spot-web/scripts/verify-kv-bundle.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-kv-bundle
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare every served preview file with the immutable release
        id: integrity
        continue-on-error: true
        run: node scripts/verify-kv-bundle.mjs
      - name: Commit reproducible verification evidence
        if: always()
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-web/docs/static-preview-bundle-qa.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: record verified KV bundle manifest [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
      - name: Fail if a file was missing or had different bytes
        if: steps.integrity.outcome != 'success'
        run: exit 1
