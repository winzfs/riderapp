name: Rider Spot transparent angular v184 production smoke
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-transparent-angular-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm live HTML/SW, PNG bundle and preserved map source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const host='https://rider-spot.jazzhjm.workers.dev';
          const hash='906de201b6e1';
          const pairs=[
            ['/', 'prebuilt/index.html'],
            ['/sw.js','prebuilt/sw.js'],
            ['/assets/rider-spot-'+hash+'/app.mjs','prebuilt/app.mjs'],
            ['/assets/rider-spot-'+hash+'/design-system.css','prebuilt/design-system.css']
          ];
          for(const [path,local] of pairs){
            const res=await fetch(host+path,{headers:{'Cache-Control':'no-cache'}});
            assert.equal(res.status,200,path+' HTTP '+res.status);
            const received=await res.text();
            assert.equal(received,fs.readFileSync(local,'utf8'),path+' production bytes mismatch');
            console.log('PASS exact LIVE',path,received.length);
          }
          const res=await fetch(host+'/mapdata/manifest.json');
          assert.equal(res.status,200);
          assert.ok((await res.json()).counts);
          const css=fs.readFileSync('prebuilt/design-system.css','utf8');
          assert.ok(css.includes('background:transparent!important'),'transparent icon container style');
          const app=fs.readFileSync('prebuilt/app.mjs','utf8');
          assert.ok(app.includes('data:image/png;base64,'),'inline PNG');
          console.log('PASS production map and transparent part resource');
          NODE
