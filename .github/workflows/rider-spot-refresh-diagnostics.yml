name: Rider Spot refresh source diagnostics
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-refresh-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live PWA script and reload triggers
        shell: bash
        run: |
          set -euo pipefail
          for base in https://rider-spot.jazzhjm.workers.dev https://e2160ce3-rider-spot.jazzhjm.workers.dev; do
            echo "=== PWA script from $base ==="
            if curl --retry 2 --max-time 30 --fail --silent --show-error "$base/pwa-init.js" -o /tmp/pwa-init.js; then
              wc -c /tmp/pwa-init.js
              grep -Eni 'reload|location|controllerchange|updatefound|skipwaiting|register|setinterval|visibilitychange|unload|pageshow' /tmp/pwa-init.js | head -80 || true
            fi
          done
      - name: Inspect archived Android WebView lifecycle for reloads and renderer recreation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rider-native
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rider-native
          grep -RInE 'onRenderProcessGone|onResume|onPause|onPageFinished|shouldOverrideUrlLoading|loadUrl\\(|reload\\(|onReceivedError|WebViewClient' /tmp/rider-native/app/src/main/java | head -110 || true
