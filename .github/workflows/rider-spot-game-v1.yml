name: Rider Spot gamification v1 preview QA
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-game-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - name: Test 320px and tablet layouts against gamification preview
        env:
          RIDER_UI_URL: https://cc7c6ecb-rider-spot.jazzhjm.workers.dev/
        run: node tests/v62-viewport.cjs
      - name: Prepare QA fixture for mobile/native run
        run: |
          sed -i "s/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/" tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
      - name: Verify gamification UI, map and all mobile screens against preview
        env:
          RIDER_UI_URL: https://cc7c6ecb-rider-spot.jazzhjm.workers.dev/
        run: node tests/ui-browser.cjs
      - name: Verify native GPS bridge and offline completion
        env:
          RIDER_TEST_URL: https://cc7c6ecb-rider-spot.jazzhjm.workers.dev/
          RIDER_TEST_CASE: native
          RIDER_APK_BRIDGE: /tmp/rs62-android/app/src/main/assets/native-bridge.js
        run: |
          mkdir -p /tmp/rs62-android
          tar -xf ../rider-spot-android/source.tar.xz -C /tmp/rs62-android
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-game-v1-evidence
          path: |
            /tmp/rider-ui-evidence
            /tmp/rider-v62-viewports
          retention-days: 14
