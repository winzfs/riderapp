name: Rider Spot isolated staging APK Android emulator smoke
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-backend-staging-emulator-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Retrieve verified side-by-side test APK
        uses: actions/download-artifact@v4
        with:
          name: RiderSpot-Backend-Staging-Parallel-APK
          repository: winzfs/riderapp
          run-id: 44690579269
          github-token: ${{ github.token }}
          path: /tmp/rider-spot-android-qa
      - name: Check installed binary
        run: test -s /tmp/rider-spot-android-qa/app-debug.apk
      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Prepare a single-shell Android emulator check script
        shell: bash
        run: |
          cat > /tmp/rider-spot-emulator-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          APK=/tmp/rider-spot-android-qa/app-debug.apk
          PACKAGE=com.riderspot.android.migrationqa
          mkdir -p /tmp/rider-spot-emulator-evidence
          # Prepare online connectivity and avoid obscuring native permission dialogs.
          adb shell settings put global airplane_mode_on 0 || true
          adb shell svc wifi enable || true
          adb shell svc data enable || true
          adb install -r "$APK"
          adb shell pm path "$PACKAGE"
          adb shell pm grant "$PACKAGE" android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm grant "$PACKAGE" android.permission.ACCESS_COARSE_LOCATION || true
          adb shell pm grant "$PACKAGE" android.permission.POST_NOTIFICATIONS || true
          adb shell dumpsys connectivity > /tmp/rider-spot-emulator-evidence/connectivity.txt || true
          adb logcat -c
          passed=0
          for attempt in 1 2 3 4 5 6; do
            adb shell am start -W -n "$PACKAGE/com.riderspot.android.MainActivity"
            sleep 9
            adb shell uiautomator dump /sdcard/rs-window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/rs-window.xml > /tmp/rider-spot-emulator-evidence/first-window.xml || true
            adb exec-out screencap -p > /tmp/rider-spot-emulator-evidence/first-launch.png
            if grep -Eq '(지도|타임라인|수익|내 바이크)' /tmp/rider-spot-emulator-evidence/first-window.xml \
              && ! grep -Eq '(Webpage not available|ERR_INTERNET_DISCONNECTED)' /tmp/rider-spot-emulator-evidence/first-window.xml; then
              passed=1
              break
            fi
            echo "Staging WebView has not rendered navigation, attempt $attempt"
            adb shell am force-stop "$PACKAGE" || true
          done
          adb logcat -d -v brief > /tmp/rider-spot-emulator-evidence/logcat.txt || true
          if [ "$passed" -ne 1 ]; then
            echo "FAIL: Android process was able to start, but loaded staging UI was NOT proven."
            grep -Eo '(Webpage not available|ERR_INTERNET_DISCONNECTED|지도|타임라인)' /tmp/rider-spot-emulator-evidence/first-window.xml || true
            exit 1
          fi
          adb shell input keyevent KEYCODE_HOME
          sleep 2
          adb shell monkey -p "$PACKAGE" 1
          sleep 8
          adb shell pidof "$PACKAGE" >/dev/null
          adb shell uiautomator dump /sdcard/rs-window.xml >/dev/null 2>&1 || true
          adb shell cat /sdcard/rs-window.xml > /tmp/rider-spot-emulator-evidence/relaunch-window.xml || true
          adb exec-out screencap -p > /tmp/rider-spot-emulator-evidence/relaunch.png
          if grep -Eq '(Webpage not available|ERR_INTERNET_DISCONNECTED)' /tmp/rider-spot-emulator-evidence/relaunch-window.xml; then
            echo "FAIL: WebView disconnected after relaunch"
            exit 1
          fi
          adb logcat -d -s AndroidRuntime:E > /tmp/rider-spot-emulator-evidence/runtime-errors.log
          if grep -F 'FATAL EXCEPTION' /tmp/rider-spot-emulator-evidence/runtime-errors.log; then
            echo "FAIL: AndroidRuntime exception detected"
            exit 1
          fi
          echo "PASS: Separate QA APK displayed real Rider Spot navigation and survived relaunch"
          SCRIPT
          chmod +x /tmp/rider-spot-emulator-smoke.sh
      - name: Install and launch preview APK without sharing production app data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash /tmp/rider-spot-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RiderSpot-Staging-Android-Emulator-QA
          path: /tmp/rider-spot-emulator-evidence
          if-no-files-found: warn
          retention-days: 14
