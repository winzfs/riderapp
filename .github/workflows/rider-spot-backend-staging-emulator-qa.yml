name: Rider Spot isolated staging APK Android emulator smoke
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-backend-staging-emulator-qa.yml'
      - 'rider-spot-android/qa/verify-webview-cdp.mjs'
      - 'rider-spot-web/edge/api-core.mjs'
      - 'rider-spot-web/edge/static-edge.mjs'
      - 'rider-spot-web/wrangler.kv-front-preview.json'
      - 'rider-spot-web/wrangler.api-core-preview.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve separately built QA APK with test-only WebView debugging
        uses: actions/download-artifact@v4
        with:
          name: RiderSpot-Backend-Staging-Parallel-APK
          repository: winzfs/riderapp
          run-id: 44694226110
          github-token: ${{ github.token }}
          path: /tmp/rider-spot-android-qa
      - name: Check verified build artifact and emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/rider-spot-android-qa/app-debug.apk
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Prepare a single-shell CDP-enabled WebView acceptance script
        shell: bash
        run: |
          cat > /tmp/rider-spot-emulator-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          APK=/tmp/rider-spot-android-qa/app-debug.apk
          PACKAGE=com.riderspot.android.migrationqa
          EVIDENCE=/tmp/rider-spot-emulator-evidence
          mkdir -p "$EVIDENCE"
          adb shell settings put global airplane_mode_on 0 || true
          adb shell svc wifi enable || true
          adb shell svc data enable || true
          adb install -r "$APK"
          adb shell pm path "$PACKAGE"
          adb shell pm grant "$PACKAGE" android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm grant "$PACKAGE" android.permission.ACCESS_COARSE_LOCATION || true
          adb shell pm grant "$PACKAGE" android.permission.POST_NOTIFICATIONS || true
          adb shell dumpsys connectivity > "$EVIDENCE/connectivity.txt" || true
          adb shell getprop net.dns1 > "$EVIDENCE/android-dns.txt" || true
          adb shell ping -c 1 rider-spot-static-preview.jazzhjm.workers.dev > "$EVIDENCE/guest-dns-probe.txt" 2>&1 || true
          adb logcat -c
          open_cdp() {
            local pid
            pid=$(adb shell pidof "$PACKAGE" | tr -d '\r' | awk '{print $1}')
            test -n "$pid"
            adb forward --remove tcp:9222 >/dev/null 2>&1 || true
            adb forward tcp:9222 "localabstract:webview_devtools_remote_$pid"
          }
          dismiss_system_anr() {
            local path="$EVIDENCE/system-window.xml"
            adb shell uiautomator dump /sdcard/rs-window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/rs-window.xml > "$path" || true
            if grep -Fq "Pixel Launcher isn't responding" "$path"; then
              echo "Closing ANR overlay belonging to emulator Pixel Launcher"
              adb shell input tap 540 1233
              sleep 3
            fi
          }
          # Android official emulator guidance recommends explicit DNS when the
          # virtual device gets net::ERR_NAME_NOT_RESOLVED on an otherwise
          # connected virtual network. Retry only the isolated QA app boot.
          first_ok=0
          for attempt in 1 2 3; do
            adb shell am start -W -n "$PACKAGE/com.riderspot.android.MainActivity"
            sleep 12
            dismiss_system_anr
            open_cdp
            if node rider-spot-android/qa/verify-webview-cdp.mjs first-launch; then
              first_ok=1
              break
            fi
            echo "Staging WebView DNS/initialization retry $attempt"
            adb shell am force-stop "$PACKAGE" || true
            sleep 3
          done
          adb exec-out screencap -p > "$EVIDENCE/first-launch.png"
          if [ "$first_ok" -ne 1 ]; then
            adb logcat -d -v brief > "$EVIDENCE/logcat.txt" || true
            echo "FAIL: First QA WebView did not expose all five Rider Spot tabs"
            exit 1
          fi
          adb shell input keyevent KEYCODE_HOME
          sleep 3
          adb shell am start -W -n "$PACKAGE/com.riderspot.android.MainActivity"
          sleep 7
          dismiss_system_anr
          open_cdp
          if ! node rider-spot-android/qa/verify-webview-cdp.mjs relaunch; then
            adb exec-out screencap -p > "$EVIDENCE/relaunch.png"
            adb logcat -d -v brief > "$EVIDENCE/logcat.txt" || true
            echo "FAIL: WebView lost the five-tab application after Android relaunch"
            exit 1
          fi
          adb exec-out screencap -p > "$EVIDENCE/relaunch.png"
          adb logcat -d -s AndroidRuntime:E > "$EVIDENCE/runtime-errors.log"
          if grep -Fq 'FATAL EXCEPTION' "$EVIDENCE/runtime-errors.log"; then
            echo 'FAIL: AndroidRuntime exception'
            exit 1
          fi
          echo 'PASS isolated QA Android WebView DOM (5 tabs), first launch and relaunch'
          SCRIPT
          chmod +x /tmp/rider-spot-emulator-smoke.sh
      - name: Install and verify actual WebView DOM and app relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          script: bash /tmp/rider-spot-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RiderSpot-Staging-Android-Emulator-CDP-QA
          path: /tmp/rider-spot-emulator-evidence
          if-no-files-found: warn
          retention-days: 14
