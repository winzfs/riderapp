name: Rider Spot back navigation native source inspection
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-back-native-inspection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native hardware-back and WebView handlers
        run: |
          mkdir -p /tmp/rider-native-inspect
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rider-native-inspect
          FILE=/tmp/rider-native-inspect/app/src/main/java/com/riderspot/android/MainActivity.java
          test -f "$FILE"
          echo '=== MainActivity back and WebView method references ==='
          grep -nE 'onBackPressed|OnBackPressed|goBack|canGoBack|setWebViewClient|shouldOverrideUrlLoading|loadUrl|evaluateJavascript|onCreate|onPageFinished|onRenderProcessGone|addJavascriptInterface' "$FILE" || true
          echo '=== MainActivity source, first 250 lines ==='
          sed -n '1,250p' "$FILE"
          echo '=== MainActivity source, last 120 lines ==='
          tail -n 120 "$FILE"
          echo '=== Native bridge and helper names ==='
          find /tmp/rider-native-inspect/app/src/main -name '*bridge*' -o -name '*Back*'
          echo '=== Android manifest launcher ==='
          grep -nE 'MainActivity|targetSdkVersion|android:exported' /tmp/rider-native-inspect/app/src/main/AndroidManifest.xml || true
