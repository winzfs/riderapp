name: Rider Spot Daily Timeline Browser Smoke
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-daily-browser.yml'
      - 'rider-spot-web/tests/daily-browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check candidate Positron map in native mode, ride selection and navigation
        env:
          RIDER_PREBUILT: "1"
        run: node tests/daily-browser.cjs
