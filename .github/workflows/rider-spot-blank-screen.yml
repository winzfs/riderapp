name: Rider Spot blank-screen diagnostic
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-blank-screen.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect failed preview and restored live version
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async ()=>{
            const browser=await chromium.launch({headless:true});
            for(const base of [
              'https://df40f4c8-rider-spot.jazzhjm.workers.dev/',
              'https://rider-spot.jazzhjm.workers.dev/'
            ]) {
              const context=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'block'});
              const page=await context.newPage();
              const errors=[], requests=[], exceptions=[];
              const cdp=await context.newCDPSession(page);
              await cdp.send('Runtime.enable');
              cdp.on('Runtime.exceptionThrown', ({exceptionDetails: d})=>{
                exceptions.push({text:d.text,url:d.url,line:d.lineNumber,column:d.columnNumber,stack:d.stackTrace,description:d.exception?.description});
              });
              page.on('pageerror',e=>errors.push('PAGE ERROR '+(e.stack||e.message)));
              page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text());});
              page.on('requestfailed',r=>requests.push(r.url()+' '+r.failure()?.errorText));
              page.on('response',r=>{if(r.status()>=400) requests.push(r.status()+' '+r.url());});
              try { const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(4500);
                console.log(JSON.stringify({base,status:response?.status(),title:await page.title(),body:(await page.locator('body').innerText()).slice(0,250),nav:await page.locator('.bottom-nav').count(),rootLength:(await page.locator('#root').innerHTML()).length,errors:errors.slice(0,15),requests:requests.slice(0,25),exceptions:exceptions.slice(0,8),scripts:await page.evaluate(()=>[...document.scripts].map(s=>({src:s.src,type:s.type})))},null,2));
              }catch(e){console.log(base,'DIAGNOSTIC FAILED',e.message,'ERRORS',errors,'REQUESTS',requests);}
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
