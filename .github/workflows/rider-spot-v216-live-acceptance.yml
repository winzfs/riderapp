name: Rider Spot v216 timeline preview acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v216-live-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - name: Verify preview v216 actually serves new timeline, and preserves other core assets
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const preview='https://e2160ce3-rider-spot.jazzhjm.workers.dev';
          const production='https://rider-spot.jazzhjm.workers.dev';
          const get=async(u)=>{const response=await fetch(u,{headers:{'Cache-Control':'no-cache'}});assert.equal(response.status,200,u+' HTTP status');return response.text()};
          const [html,sw,css,app,oldHtml]=await Promise.all([
            get(preview+'/'),
            get(preview+'/sw.js'),
            get(preview+'/assets/rider-spot-c17fa17b5a0c/daily-timeline.css'),
            get(preview+'/assets/rider-spot-c17fa17b5a0c/app.mjs'),
            get(production+'/'),
          ]);
          for(const text of [html,sw]) {
            assert.ok(text.includes('/assets/rider-spot-c17fa17b5a0c/app.mjs'),'new app must be referenced');
            assert.ok(text.includes('/assets/rider-spot-c17fa17b5a0c/daily-timeline.css'),'new style must be referenced');
          }
          assert.ok(sw.includes('rider-spot-shell-timeline-layout-v216'),'service worker cache version');
          assert.ok(css.includes('Timeline v213:')&&css.includes('rs-timeline-summary'),'new CSS');
          assert.ok(app.includes('rs-timeline-detail-heading')&&app.includes('__rsStartupMainCameraSet'),'new UI and v215 camera feature preserved');
          for(const p of ['/api/industry-news','/api/route-match']) {
            assert.ok(html.length>1500,'nonempty entry document');
          }
          const legacyAssets=[...oldHtml.matchAll(/\/(?:assets\/[^"']+\/)?(?:workspace-tools\.js|map-reports\.js)/g)].map(x=>x[0]);
          for(const entry of legacyAssets)assert.ok(html.includes(entry),'existing assets missing: '+entry);
          console.log('PASS v216 live preview assets',app.length,css.length,'old assets',legacyAssets);
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Apply existing QA-only location fixtures
        run: |
          sed -i 's/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/' tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
      - name: Real v216 mobile UI, timeline, zoom and replay
        env:
          RIDER_UI_URL: https://e2160ce3-rider-spot.jazzhjm.workers.dev/
          RIDER_SCREENSHOTS: /tmp/rider-v216
        run: node tests/ui-browser.cjs
      - name: Native GPS bridge and offline trip regression
        env:
          RIDER_TEST_URL: https://e2160ce3-rider-spot.jazzhjm.workers.dev/
          RIDER_TEST_CASE: native
          RIDER_APK_BRIDGE: /tmp/rider-v216-android/app/src/main/assets/native-bridge.js
        run: |
          mkdir -p /tmp/rider-v216-android
          tar -xf ../rider-spot-android/source.tar.xz -C /tmp/rider-v216-android
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-v216-acceptance-evidence
          path: |
            /tmp/rider-v216
            /tmp/rider-ui-evidence
          retention-days: 7
