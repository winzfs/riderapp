name: Rider Spot v12 isolated preview acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-v12-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rider-spot-v12-preview-acceptance
  cancel-in-progress: true
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_V12_URL: https://rider-spot-v12-preview.jazzhjm.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - name: Check pinned release, historical assets and recovery guard
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.RIDER_V12_URL;
          const hash='57888bba6c49';
          async function get(path,type){
            const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}});
            assert.equal(r.status,200,path+' status '+r.status);
            if(type)assert.ok(r.headers.get('content-type')?.includes(type),path+' content type');
            return r.text();
          }
          const home=await get('/','text/html');
          assert.ok(home.includes('/assets/rider-spot-'+hash+'/app.mjs'),'v12 app script must be active');
          assert.ok(home.includes('rs-recovery-guard-v217'),'native recovery guard must be present');
          const sw=await get('/sw.js','javascript');
          assert.ok(sw.includes(hash),'service worker must use v12 hash');
          const app=await get('/assets/rider-spot-'+hash+'/app.mjs','javascript');
          assert.ok(app.includes('rs12-map-settings')&&app.includes('rs12-community-masthead'),'compiled v12 components');
          const style=await get('/assets/rider-spot-'+hash+'/curated-v9.css','css');
          assert.ok(style.includes('URBAN EDITORIAL V12')&&style.includes('rs12-route-tools'),'compiled v12 stylesheet');
          const old=await get('/assets/rider-spot-0edfbcdd3450/curated-v9.css','css');
          assert.ok(old.length>10000,'existing in-flight client CSS remains served');
          console.log('RIDER_V12_PUBLIC_ASSETS_PASS',hash,home.length,app.length,style.length,old.length);
          NODE
      - run: npx playwright install chromium
      - name: Browser verify 320, 393, 412px, five tabs and no reload
        run: RIDER_VISUAL_URL="$RIDER_V12_URL" node tests/urban-flow-v11-browser.cjs
      - name: Signed-in fixtures for ride, income, maintenance and native behavior
        run: RIDER_TEST_ORIGIN="$RIDER_V12_URL" RIDER_SCREENSHOTS=/tmp/rider-v12-preview-evidence node tests/mobile-records-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-v12-preview-evidence
          path: |
            /tmp/rider-spot-urban-flow-v11
            /tmp/rider-v12-preview-evidence
          if-no-files-found: warn
          retention-days: 10
