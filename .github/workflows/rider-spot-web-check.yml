name: Rider Spot Web checks

on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - "rider-spot-web/src/**"
      - "rider-spot-web/scripts/**"
      - "rider-spot-web/tests/**"
      - "rider-spot-web/package.json"
      - "rider-spot-web/package-lock.json"
      - ".github/workflows/rider-spot-web-check.yml"
  pull_request:
    paths:
      - "rider-spot-web/src/**"
      - "rider-spot-web/scripts/**"
      - "rider-spot-web/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Verify facility registration sheet, map pin and Android Back
        run: RIDER_TEST_CASE=facility node tests/browser.cjs
      - name: Exercise mobile record forms and timeline
        env:
          RIDER_SCREENSHOTS: /tmp/mobile-records
        run: node tests/mobile-records-browser.cjs
      - name: Verify native bridge finish, skipped income and offline retry
        env:
          RIDER_TEST_CASE: native
          RIDER_APK_BRIDGE: /tmp/rider-native-bridge.js
          RIDER_BASELINE_DIR: /tmp/rider-legacy-assets
        run: |
          tar -xOf ../rider-spot-android/source.tar.xz ./app/src/main/assets/native-bridge.js > "$RIDER_APK_BRIDGE"
          mkdir -p "$RIDER_BASELINE_DIR"
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const html=await fs.readFile('dist/index.html','utf8');
          for(const [,path] of html.matchAll(/src="(\/[^"]+\.js)"/g)){
            if(path.startsWith('/assets/'))continue;
            const res=await fetch(new URL(path,'https://rider-spot.jazzhjm.workers.dev'));
            if(!res.ok)throw Error(path+' '+res.status);
            await fs.writeFile(process.env.RIDER_BASELINE_DIR+path,await res.text());
          }
          NODE
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-record-screens
          path: /tmp/mobile-records/
