name: Rider Spot semi-flat PNG v181 candidate acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-flat-png-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_UI_URL: https://5a72da79-rider-spot.jazzhjm.workers.dev/
      RIDER_SCREENSHOTS: /tmp/rider-flat-png-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - name: Validate staged preview HTML, PWA and image-generated PNG resource
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root=process.env.RIDER_UI_URL;
          const hash='ce520b450457';
          const paths=['/','/sw.js','/assets/rider-spot-'+hash+'/app.mjs',
            '/assets/rider-spot-'+hash+'/design-system.css',
            '/assets/rider-spot-'+hash+'/workspace-tools.js','/mapdata/manifest.json'];
          const resources={};
          for(const path of paths){
            const response=await fetch(new URL(path,root));
            assert.equal(response.status,200,path+' HTTP '+response.status);
            resources[path]=await response.text();
            assert.ok(resources[path].length>100,path+' missing bytes');
          }
          const app=resources['/assets/rider-spot-'+hash+'/app.mjs'];
          assert.ok(app.includes('data:image/png;base64,') && app.includes('500% 200%'),'PNG atlas is not in bundle');
          assert.ok(resources['/'].includes('/assets/rider-spot-'+hash+'/app.mjs'),'new HTML route');
          assert.ok(resources['/sw.js'].includes('rider-spot-shell-'+hash),'service worker cache key');
          assert.ok(resources['/assets/rider-spot-'+hash+'/design-system.css'].includes('bike-part-svg'),'PNG CSS');
          assert.ok(JSON.parse(resources['/mapdata/manifest.json']).counts,'map data preserved');
          console.log('PASS preview PNG assets, PWA, and map data');
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Diagnose browser script loads on candidate
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox']});
            const page=await browser.newPage();
            const cdp=await page.context().newCDPSession(page);
            const scripts=new Map();
            await cdp.send('Debugger.enable');
            await cdp.send('Runtime.enable');
            cdp.on('Debugger.scriptParsed',event=>scripts.set(event.scriptId,event.url));
            cdp.on('Runtime.exceptionThrown',event=>{
              const e=event.exceptionDetails;
              console.log('DIAG CDP EXCEPTION:',JSON.stringify({text:e.text,url:e.url,scriptId:e.scriptId,scriptUrl:scripts.get(e.scriptId),line:e.lineNumber,column:e.columnNumber,description:e.exception?.description,stack:e.stackTrace}));
            });
            page.on('pageerror',error=>console.log('DIAG PAGE ERROR:',error.stack||String(error)));
            page.on('console',message=>{if(message.type()==='error')console.log('DIAG CONSOLE ERROR:',message.text())});
            page.on('requestfailed',request=>console.log('DIAG REQUEST FAILED:',request.url(),request.failure()?.errorText));
            page.on('response',response=>{
              const url=response.url();
              if(url.includes('rider-spot-ce520b450457')||url.includes('rider-maintenance-v40')){
                console.log('DIAG ASSET RESPONSE:',response.status(),url);
              }
            });
            const response=await page.goto(process.env.RIDER_UI_URL,{waitUntil:'domcontentloaded',timeout:30000});
            console.log('DIAG HTML STATUS:',response?.status());
            await page.waitForTimeout(7000);
            console.log('DIAG ROOT:',await page.evaluate(()=>({title:document.title,html:document.getElementById('root')?.innerHTML.slice(0,200),scripts:[...document.scripts].filter(x=>x.src).map(x=>({src:x.src,type:x.type}))})));
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Synthetic mobile bike, timeline and map UI preview
        run: |
          sed -i 's/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/' tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
          node tests/ui-browser.cjs
      - name: Verify maintenance retry, part history, odometer and income on actual preview
        run: |
          sed -i 's@const origin="https://rider-spot.jazzhjm.workers.dev";@const origin="https://5a72da79-rider-spot.jazzhjm.workers.dev";@' tests/mobile-records-browser.cjs
          node tests/mobile-records-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-flat-png-v181-qa
          path: |
            /tmp/rider-flat-png-qa
            /tmp/rider-ui-evidence
          retention-days: 14
