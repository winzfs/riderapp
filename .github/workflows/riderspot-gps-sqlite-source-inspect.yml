name: RiderSpot GPS SQLite source inspection
on:
  push:
    branches: [feature/riderspot-gps-device-only-backup-restore-v49-20261123]
    paths: ['.github/workflows/riderspot-gps-sqlite-source-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android native source for safe backup and restore integration
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs-source /tmp/rs-out
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rs-source
          cp -a /tmp/rs-source/app/src/main/java/com/riderspot/android /tmp/rs-out/android-java
          cp /tmp/rs-source/app/src/main/assets/native-bridge.js /tmp/rs-out/native-bridge.js
          cp /tmp/rs-source/app/src/main/AndroidManifest.xml /tmp/rs-out/AndroidManifest.xml
          cp /tmp/rs-source/app/build.gradle /tmp/rs-out/build.gradle
          find /tmp/rs-out -maxdepth 3 -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: riderspot-android-sqlite-source-v49
          path: /tmp/rs-out/
          if-no-files-found: error
          retention-days: 1
