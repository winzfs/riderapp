name: Rider Spot v192 live asset and Android Back source verification
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v192-production-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check deployed v192 bytes and original map data
        working-directory: rider-spot-web
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://rider-spot.jazzhjm.workers.dev',hash='da2770296e24';
          assert.equal(JSON.parse(fs.readFileSync('prebuilt/release.json','utf8')).hash,hash);
          for(const [path,file] of [['/','index.html'],['/sw.js','sw.js'],
            ...['app.mjs','tab-resume.js','native-gps.js','route-worker.mjs','workspace-tools.js','design-system.css','map-reports.js','daily-timeline.css'].map(name=>['/assets/rider-spot-'+hash+'/'+name,name])]){
            const r=await fetch(base+path,{headers:{'Cache-Control':'no-cache'}});
            assert.equal(r.status,200,path+' HTTP response');
            const actual=await r.text(),expected=fs.readFileSync('prebuilt/'+file,'utf8');
            assert.equal(actual,expected,path+' live artifact differs');
            if(file==='tab-resume.js')assert.ok(!actual.includes('setInterval('),'stale loop still in tab resume');
            if(file==='app.mjs')assert.ok(actual.includes('__rsHandleBack')&&actual.includes('riderspot:root-back'),'missing Back policy');
            console.log('PASS live',path,actual.length);
          }
          const map=await fetch(base+'/mapdata/manifest.json');
          assert.equal(map.status,200,'map manifest should be preserved');
          assert.ok((await map.json()).counts,'map POI data must be available');
          console.log('PASS original geographic assets');
          NODE
      - name: Inspect native Android WebView Back handling for compatibility
        run: |
          mkdir -p /tmp/rider-native-inspect
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rider-native-inspect
          echo 'Native Back handler locations:'
          grep -Rn -E 'onBackPressed|__rsHandleBack|onBackInvoked|riderspot:exit-request|__rsNativeExit' /tmp/rider-native-inspect/app/src/main | head -70 || true
