name: Rider Spot v216 reload differential - weather / service worker
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-weather-reload-diagnostic.yml'
      - 'rider-spot-web/tests/weather-reload-live.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare weather enabled, weather disabled and service worker disabled
        run: node tests/weather-reload-live.cjs
      - name: Scan all live scripts for forced navigation and update hooks
        run: |
          node --input-type=module <<'NODE'
          const home='https://rider-spot.jazzhjm.workers.dev';
          const entry=await fetch(home+'/').then(r=>r.text());
          const refs=[...new Set([...entry.matchAll(/src="(\/[^"]+\.js(?:\?[^"]*)?|\/[^"]+\.mjs)"/g)].map(m=>m[1]))];
          const checks=['location.reload','location.replace','location.href','window.location','document.location','controllerchange','skipWaiting','clients.claim','history.go(','onbeforeunload','setInterval'];
          for (const path of ['/sw.js','/pwa-init.js',...refs]){
            try {
              const resp=await fetch(home+path); const content=await resp.text();
              const hits=[];
              for(const item of checks){
                let idx=content.indexOf(item),count=0;
                while(idx>=0 && count<5) {
                  hits.push({item,index:idx,surrounding:content.slice(Math.max(0,idx-90),idx+115)});
                  idx=content.indexOf(item,idx+item.length); count++;
                }
              }
              console.log('SCRIPT',path,'status',resp.status,'bytes',content.length,JSON.stringify(hits).slice(0,3500));
            }catch(e){console.log('SCRIPT_ERR',path,String(e))}
          }
          NODE
