name: Rider Spot journey and toilet-only acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - 'rider-spot-web/src/**'
      - 'rider-spot-web/tests/journey*'
      - '.github/workflows/rider-spot-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - name: Start isolated candidate and prepare existing native fixture
        run: |
          node scripts/local-preview.cjs > /tmp/rider-preview.log 2>&1 &
          sed -i 's/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/' tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
          mkdir -p /tmp/rider-apk
          tar -xf ../rider-spot-android/source.tar.xz -C /tmp/rider-apk
      - name: Journey interactions and persistence at three widths
        env:
          RIDER_UI_URL: http://127.0.0.1:8789/
        run: node tests/journey-browser.cjs
      - name: Existing mobile screens, toilet-only pins, map and timeline
        env:
          RIDER_UI_URL: http://127.0.0.1:8789/
        run: node tests/ui-browser.cjs
      - name: Native bridge and offline trip completion
        env:
          RIDER_TEST_URL: http://127.0.0.1:8789/
          RIDER_TEST_CASE: native
          RIDER_APK_BRIDGE: /tmp/rider-apk/app/src/main/assets/native-bridge.js
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-journey-evidence
          path: |
            /tmp/rider-journey-evidence
            /tmp/rider-ui-evidence
            /tmp/rider-preview.log
          retention-days: 14
