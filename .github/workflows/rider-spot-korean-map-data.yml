name: Rider Spot Korean public map import
# Historical snapshot regeneration is manual only. Scheduled production refresh
# is controlled by main:.github/workflows/rider-spot-korean-map-schedule.yml.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-korean-map-data
  cancel-in-progress: true
jobs:
  import-gwangju:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned, publicly licensed source files
        shell: bash
        run: |
          mkdir -p /tmp/rs-korean-data
          python3 - <<'PY'
          import hashlib
          import pathlib
          import urllib.parse
          import urllib.request
          target = pathlib.Path('/tmp/rs-korean-data')
          name = '소상공인시장진흥공단_상가(상권)정보_광주_202506.csv'
          url = ('https://huggingface.co/datasets/ginipick/market/resolve/'
                 'a6aed20732aa75f3d5cbf6ab43277c826e372473/'
                 + urllib.parse.quote(name) + '?download=true')
          sources = [
            ('shops.csv', url,
             '47f83409b27b0313d2fbfbf976d8ef8114d78a77b8dc0565f2ddffe776dec577'),
            ('emd.geojson',
             'https://raw.githubusercontent.com/KnellBalm/kr-admin-geojson/'
             '3a859f2a45be8acf8237d9eefd9565f99cc603da/emd.geojson', None),
          ]
          for filename, url, expected_sha in sources:
            req = urllib.request.Request(url, headers={'User-Agent':'RiderSpot-public-data-import/1.0'})
            with urllib.request.urlopen(req, timeout=120) as response:
              with (target / filename).open('wb') as output:
                while chunk := response.read(1024 * 1024):
                  output.write(chunk)
            sha = hashlib.sha256((target / filename).read_bytes()).hexdigest()
            print(filename, (target / filename).stat().st_size, 'sha256', sha)
            if expected_sha and sha != expected_sha:
              raise RuntimeError('Public CSV checksum changed: refuse to publish')
          PY
      - name: Generate coordinate-checked viewport tiles
        run: python3 scripts/import-korean-map.py --shops /tmp/rs-korean-data/shops.csv --admin /tmp/rs-korean-data/emd.geojson
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - name: Commit derived tiles, not raw business CSV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/korean-map/
          if ! git diff --cached --quiet; then
            git commit -m "data(map): import Gwangju official town and SEMAS shop labels"
            git fetch origin feature/rider-spot-native-apk
            git rebase origin/feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
