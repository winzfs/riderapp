name: Rider Spot recap native gallery export APK
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - 'rider-spot-android/patch-recap-native-save.py'
      - '.github/workflows/rider-spot-recap-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-recappng:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - name: Restore original Android sources
        run: |
          mkdir -p /tmp/rs-recap-android
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rs-recap-android
          test -s /tmp/rs-recap-android/app/src/main/java/com/riderspot/android/MainActivity.java
      - name: Add isolated image saving without changing installed GPS or release tar
        run: |
          python3 rider-spot-android/patch-recap-native-save.py /tmp/rs-recap-android
          grep -Fq 'case "recap-save":' /tmp/rs-recap-android/app/src/main/java/com/riderspot/android/MainActivity.java
          grep -Fq 'window.__rsNativeSaveImage' /tmp/rs-recap-android/app/src/main/assets/native-bridge.js
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Native GPS, OAuth and lifecycle regression tests
        working-directory: /tmp/rs-recap-android
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT=$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || echo /usr/local/lib/android/sdk)
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Compile APK with Android MediaStore support
        working-directory: /tmp/rs-recap-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Keep original-package APK and create safe side-by-side test package
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs-recap-apks
          cp /tmp/rs-recap-android/app/build/outputs/apk/debug/app-debug.apk /tmp/rs-recap-apks/RiderSpot-Recap-native-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          g=Path('/tmp/rs-recap-android/app/build.gradle')
          t=g.read_text()
          assert t.count('defaultConfig {')==1
          g.write_text(t.replace('defaultConfig {','defaultConfig {\n        applicationIdSuffix ".recap"',1))
          m=Path('/tmp/rs-recap-android/app/src/main/AndroidManifest.xml')
          t=m.read_text()
          import re
          t,n=re.subn(r'android:label="[^"]+"','android:label="라이더스팟 리캡 테스트"',t,count=1)
          assert n==1
          m.write_text(t)
          PY
          cd /tmp/rs-recap-android
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/rs-recap-apks/RiderSpot-Recap-side-by-side-TEST.apk
          sha256sum /tmp/rs-recap-apks/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RiderSpot-Recap-Native-PNG-APKs
          path: /tmp/rs-recap-apks/*.apk
          retention-days: 30
          if-no-files-found: error
