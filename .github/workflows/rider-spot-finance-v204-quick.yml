name: Rider Spot finance v204 isolated verified build
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-finance-v204-quick.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finance-v204-isolated
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Freeze isolated v204 release without overwriting earlier production assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const rel=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const base='dist/assets/rider-spot-'+rel.hash+'/';
          const app=fs.readFileSync(base+'app.mjs','utf8');
          const css=fs.readFileSync(base+'design-system.css','utf8');
          assert.match(rel.hash,/^[a-f0-9]{12}$/);
          for(const needle of ['rider_recurring_expenses','rider_finance_payout_rules','neo-flat-original-v197','rider_extra_expenses','rs_save_income_with_components','rs_save_daily_income_guarded','fin-record-search'])
            assert.ok(app.includes(needle),needle);
          assert.ok(css.includes('fin-recurring'));
          assert.ok(css.includes('fin-svg-chart'));
          assert.ok(css.includes('fin-record-search'));
          assert.ok(css.includes('.app .finance-page .fin-card>header'));
          assert.ok(css.includes('.app .finance-page .fin-no-records'));
          assert.ok(app.includes('fin-platform-card'));
          assert.ok(app.includes('플랫폼별 수익'));
          assert.ok(app.includes('fin-chart-card'));
          assert.ok(css.includes('fin-undo'));
          assert.ok(fs.readFileSync('dist/index.html','utf8').includes(rel.hash));
          fs.mkdirSync('prebuilt-v204',{recursive:true});
          for(const name of ['app.mjs','route-worker.mjs','native-gps.js','map-reports.js','design-system.css',
            'workspace-tools.js','tab-resume.js','daily-timeline.css'])
            fs.copyFileSync(base+name,'prebuilt-v204/'+name);
          for(const name of ['index.html','sw.js','release.json'])
            fs.copyFileSync('dist/'+name,'prebuilt-v204/'+name);
          console.log('PASS v204 isolated release hash',rel.hash);
          NODE
      - name: Persist v204 candidate in its own immutable directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt-v204
          git commit -m 'build: isolated tested finance v204 bundle [skip ci]'
          git pull --rebase origin feature/rider-spot-native-apk
          git push origin HEAD:feature/rider-spot-native-apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-v204-isolated
          path: rider-spot-web/prebuilt-v204/
          retention-days: 7
