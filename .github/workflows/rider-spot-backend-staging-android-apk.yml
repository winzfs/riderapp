name: Rider Spot isolated staging Android QA APK
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-backend-staging-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-isolated-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract native code and create a separate staging-only application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rider-spot-staging-apk
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rider-spot-staging-apk
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/rider-spot-staging-apk')
          main=root/'app/src/main/java/com/riderspot/android/MainActivity.java'
          manifest=root/'app/src/main/AndroidManifest.xml'
          gradle=root/'app/build.gradle'
          src=main.read_text()
          host='rider-spot.jazzhjm.workers.dev'
          preview='rider-spot-static-preview.jazzhjm.workers.dev'
          patches={
              f'private static final String HOME = "https://{host}/";':
                  f'private static final String HOME = "https://{preview}/";',
              f'private static final String ORIGIN = "https://{host}";':
                  f'private static final String ORIGIN = "https://{preview}";',
              f'"{host}".equalsIgnoreCase(uri.getHost())':
                  f'"{preview}".equalsIgnoreCase(uri.getHost())',
              'private static final String OAUTH_SCHEME = "riderspot-oauth";':
                  'private static final String OAUTH_SCHEME = "riderspot-migrationqa";'
          }
          for before,after in patches.items():
              assert src.count(before)==1, f'Unsafe source mismatch: {before}'
              src=src.replace(before,after,1)
          # Never open the production Google OAuth handler from the isolated QA APK.
          # OAuth end-to-end needs separate production-hostname acceptance later.
          pattern=r'        Uri start = Uri.parse\(ORIGIN \+ "/__rs_android_oauth_start"\).*?        return new JSONObject\(\)\.put\("opened", true\);'
          match=re.search(pattern,src,re.S)
          assert match and 'startActivity(browser)' in match.group(0), 'Google OAuth handler changed'
          src=src[:match.start()]+'        return new JSONObject().put("opened", false).put("error", "Google OAuth disabled in isolated QA APK");'+src[match.end():]
          main.write_text(src)
          m=manifest.read_text()
          m,n=re.subn(r'android:label="[^"]+"','android:label="Rider Spot 구조검증"',m,count=1)
          assert n==1, 'Manifest app label changed'
          assert m.count('android:scheme="riderspot-oauth"')==1, 'OAuth intent-filter changed'
          m=m.replace('android:scheme="riderspot-oauth"','android:scheme="riderspot-migrationqa"')
          assert 'android:scheme="riderspot-oauth"' not in m
          manifest.write_text(m)
          g=gradle.read_text()
          assert g.count('defaultConfig {')==1,'Gradle defaultConfig mismatch'
          g=g.replace('defaultConfig {','defaultConfig {\n        applicationIdSuffix ".migrationqa"\n        versionNameSuffix "-staging-qa"',1)
          gradle.write_text(g)
          assert f'https://{preview}/' in src
          assert f'private static final String ORIGIN = "https://{preview}"' in src
          print('PASS separate package, preview WebView origin, isolated native bridge, non-conflicting OAuth scheme')
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify original production OAuth contract remains intact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rider-spot-pristine-archive
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rider-spot-pristine-archive
          (cd /tmp/rider-spot-pristine-archive && node --test tests/native-oauth.test.cjs)
      - name: Run native GPS, service and SQLite tests for side-by-side QA package
        working-directory: /tmp/rider-spot-staging-apk
        shell: bash
        run: |
          set -euo pipefail
          # QA deliberately uses a non-conflicting OAuth scheme and disables
          # production Google login; run the original OAuth test above instead.
          find tests -maxdepth 1 -name '*.test.cjs' ! -name 'native-oauth.test.cjs' -print0 | xargs -0 node --test
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Build isolated APK without touching user's installed app
        working-directory: /tmp/rider-spot-staging-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify build artifact
        run: |
          test -s /tmp/rider-spot-staging-apk/app/build/outputs/apk/debug/app-debug.apk
          echo 'QA appId suffix: .migrationqa' >> "$GITHUB_STEP_SUMMARY"
          echo 'WebView preview origin: https://rider-spot-static-preview.jazzhjm.workers.dev/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Google OAuth intentionally disabled in side-by-side QA APK; use no real credentials.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: RiderSpot-Backend-Staging-Parallel-APK
          path: /tmp/rider-spot-staging-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
