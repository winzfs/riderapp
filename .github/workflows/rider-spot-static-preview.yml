name: Rider Spot static assets preview
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - 'rider-spot-web/edge/**'
      - 'rider-spot-web/wrangler.static-preview.json'
      - 'rider-spot-web/tests/static-edge.test.mjs'
      - '.github/workflows/rider-spot-static-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rider-static-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALTERNATE: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f3e379cc8cf3d18061a1948aecc2dad5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - name: Run all existing and new static routing unit tests
        run: npm test
      - name: Compile independent static site
        run: npm run build
      - name: Check build manifest and native reload protections
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const rel=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const hash=rel.hash;
          assert.match(hash,/^[a-f0-9]{12}$/);
          for(const name of ['app.mjs','premium-shell.css','design-system.css','weather-bar.js']){
            const f='/assets/rider-spot-'+hash+'/'+name;
            assert.ok(rel.files.includes(f));
            assert.ok(fs.existsSync('dist'+f));
          }
          assert.ok(fs.readFileSync('dist/index.html','utf8').includes(hash+'/premium-shell.css'));
          assert.ok(fs.readFileSync('dist/sw.js','utf8').includes('rider-spot-shell-'+hash));
          console.log('PASS static candidate',hash);
          NODE
          mkdir -p /tmp/rider-static-native
          tar -xJf ../rider-spot-android/source.tar.xz -C /tmp/rider-static-native
          RIDER_ANDROID_SOURCE=/tmp/rider-static-native node scripts/check-update-safety.mjs
      - name: Configure optional preview credentials
        run: |
          if [ -n "$CF_TOKEN_PRIMARY" ]; then
            echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN_PRIMARY" >> "$GITHUB_ENV"
          elif [ -n "$CF_TOKEN_ALTERNATE" ]; then
            echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN_ALTERNATE" >> "$GITHUB_ENV"
          else
            echo "No Cloudflare token in GitHub Actions; production untouched, preview deploy skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy only rider-spot-static-preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.53.0 deploy --config wrangler.static-preview.json
      - name: Verify isolated preview live response and legacy fallback
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://rider-spot-static-preview.jazzhjm.workers.dev';
          const hash=JSON.parse(fs.readFileSync('dist/release.json','utf8')).hash;
          const get=async path=>{
            const r=await fetch(base+path,{signal:AbortSignal.timeout(25000)});
            assert.equal(r.status,200,path+' '+r.status);
            return r.text();
          };
          const html=await get('/');
          assert.ok(html.includes('rs-recovery-guard-v217'));
          assert.ok(html.includes('/assets/rider-spot-'+hash+'/premium-shell.css'));
          assert.equal(await get('/assets/rider-spot-'+hash+'/premium-shell.css'),fs.readFileSync('dist/assets/rider-spot-'+hash+'/premium-shell.css','utf8'));
          assert.ok((await get('/rider-spot-shell-v40.js')).length>100);
          assert.ok((await get('/sw.js')).includes('rider-spot-shell-'+hash));
          console.log('PASS live isolated preview',hash);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-static-preview-dist
          path: rider-spot-web/dist
          retention-days: 7
