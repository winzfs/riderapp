name: Rider Spot v217 native restore-loop web guard build
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-recovery-v217-build.yml'
      - 'rider-spot-web/src/use-ride.mjs'
      - 'rider-spot-web/src/native-gps.js'
      - 'rider-spot-web/src/map-controller.mjs'
      - 'rider-spot-web/src/tab-resume.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-recovery-v217-web-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify compiled trip guard and preserve application features
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,cpSync,mkdirSync,writeFileSync} from 'node:fs';
          const release=JSON.parse(readFileSync('dist/release.json','utf8'));
          const base='dist/assets/rider-spot-'+release.hash+'/';
          const app=readFileSync(base+'app.mjs','utf8');
          const gps=readFileSync(base+'native-gps.js','utf8');
          const sw=readFileSync('dist/sw.js','utf8');
          assert.ok(app.includes('native-merged:'));
          assert.ok(app.includes('rs-weather-slot'));
          assert.ok(app.includes('finance-page'));
          assert.ok(app.includes('__rsStartupMainCameraSet'));
          assert.ok(gps.includes('mayRetryFreshNativeStart'));
          assert.ok(!gps.includes('location.reload('));
          assert.ok(!sw.includes('skipWaiting()'));
          mkdirSync('prebuilt-recovery-v217',{recursive:true});
          for (const filename of ['app.mjs','native-gps.js','tab-resume.js','design-system.css','daily-timeline.css','weather-bar.js','weather-bar.css','map-reports.js','workspace-tools.js','route-worker.mjs']) {
            cpSync(base+filename,'prebuilt-recovery-v217/'+filename);
          }
          for (const name of ['index.html','sw.js','release.json'])
            cpSync('dist/'+name,'prebuilt-recovery-v217/'+name);
          writeFileSync('prebuilt-recovery-v217/source.txt',process.env.GITHUB_SHA+'\n');
          console.log('PASS v217 recovery guard release',release.hash);
          NODE
      - name: Publish verified asset files to the branch, not the live Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt-recovery-v217
          if ! git diff --cached --quiet; then
            git commit -m 'build: verified v217 recovery and camera assets [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RiderSpot-v217-Recovery-Web-Candidate
          path: rider-spot-web/prebuilt-recovery-v217
          retention-days: 15
