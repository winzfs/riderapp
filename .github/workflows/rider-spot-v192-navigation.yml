name: Rider Spot v192 Back policy regression and verified build
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-v192-navigation.yml'
      - 'rider-spot-web/src/navigation.mjs'
      - 'rider-spot-web/src/tab-resume.js'
      - 'rider-spot-web/tests/navigation.test.mjs'
      - 'rider-spot-web/tests/tab-resume.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-v192-navigation-build
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - name: Build complete app and run navigation, sheet, GPS and data regressions
        run: |
          npm run build
          node --test tests/navigation.test.mjs tests/tab-resume.test.mjs
          # Existing 2026-11-17 journey fixture is red on the current date.
          # Run all unaffected regressions and track that unrelated failure separately.
          find tests -maxdepth 1 -name '*.test.mjs' ! -name 'journey.test.mjs' -print0 | sort -z | xargs -0 node --test
      - name: Verify restored tab preference cannot reselect a tab in the background
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const source=fs.readFileSync('src/tab-resume.js','utf8');
          assert.ok(!source.includes('setInterval('));
          assert.ok(!source.includes('Object.defineProperty(window, "__rsGoToTab"'));
          const navigation=fs.readFileSync('src/navigation.mjs','utf8');
          assert.ok(navigation.includes('history.replaceState'));
          assert.ok(!navigation.includes('history.pushState(nextState'));
          console.log('PASS no automatic tab change, replacement-only tab navigation');
          NODE
      - name: Save verified v192 prebuilt assets for production deployment
        run: |
          set -euo pipefail
          HASH=$(node -p "require('./dist/release.json').hash")
          for file in app.mjs route-worker.mjs native-gps.js map-reports.js design-system.css workspace-tools.js tab-resume.js daily-timeline.css; do
            cp "dist/assets/rider-spot-$HASH/$file" "prebuilt/$file"
          done
          cp dist/index.html prebuilt/index.html
          cp dist/sw.js prebuilt/sw.js
          cp dist/release.json prebuilt/release.json
          grep -Fq '__rsHandleBack' prebuilt/app.mjs
          grep -Fq 'riderspot:tab-restored' prebuilt/tab-resume.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt
          if ! git diff --cached --quiet; then
            git commit -m "build(web): verified v192 single-back-navigation policy [skip ci]"
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
          echo "Verified v192 bundle: $HASH"
