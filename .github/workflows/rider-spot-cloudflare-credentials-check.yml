name: Rider Spot deployment capability check
on:
  workflow_dispatch:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-cloudflare-credentials-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_B: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Check whether authenticated Wrangler deployment is available
        shell: bash
        run: |
          if [[ -n "$CF_TOKEN_A" || -n "$CF_TOKEN_B" ]]; then
            echo 'Can use a GitHub Actions Cloudflare API token to deploy'
          else
            echo 'Cloudflare deployment token is not configured in GitHub Actions. Keep changes on branch; do not overwrite the production Worker.'
          fi
