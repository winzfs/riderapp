name: Rider Spot v188 Cloudflare candidate physical Back and gesture QA
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v188-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_UI_URL: https://5bde4f34-rider-spot.jazzhjm.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - name: Verify preview uses approved 188 assets byte-for-byte
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const hash='c0e9aab3fdf9',root=process.env.RIDER_UI_URL;
          assert.equal(JSON.parse(fs.readFileSync('prebuilt/release.json','utf8')).hash,hash);
          for(const [url,file] of [['/','index.html'],['/sw.js','sw.js'],
            ...['app.mjs','design-system.css','tab-resume.js','native-gps.js'].map(n=>['/assets/rider-spot-'+hash+'/'+n,n])]){
            const r=await fetch(new URL(url,root));assert.equal(r.status,200,url);
            const actual=await r.text();
            assert.equal(actual,fs.readFileSync('prebuilt/'+file,'utf8'),url+' differs from audited candidate');
            console.log('PASS preview',url);
          }
          const j=await fetch(new URL('/mapdata/manifest.json',root));assert.equal(j.status,200);
          assert.ok((await j.json()).counts,'original map POIs lost');
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Real finger-following swipe, nested back stack, timeline and bike at 360 and 412 px
        run: |
          sed -i 's@const origin="https://rider-spot.jazzhjm.workers.dev";@const origin="https://5bde4f34-rider-spot.jazzhjm.workers.dev";@' tests/mobile-records-browser.cjs
          sed -i 's@return route.abort();@return route.continue();@g' tests/mobile-records-browser.cjs
          node tests/mobile-records-browser.cjs
      - name: Main map, community and replay UI regression
        run: |
          sed -i 's/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/' tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
          node tests/ui-browser.cjs
