name: Rider Spot square recap tested assets stage
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-recap-square-stage.yml'
      - 'rider-spot-web/src/ride-recap.mjs'
      - 'rider-spot-web/tests/ride-recap.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-square-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - name: Unit and regression tests
        working-directory: rider-spot-web
        run: npm ci && npm test
      - name: Build native-compatible hashed web assets
        working-directory: rider-spot-web
        run: npm run build
      - name: Validate square recap and WebView guard before staging
        working-directory: rider-spot-web
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const m=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const asset='dist/assets/rider-spot-'+m.hash;
          const js=fs.readFileSync(asset+'/app.mjs','utf8');
          const css=fs.readFileSync(asset+'/daily-timeline.css','utf8');
          assert.ok(js.includes('rs-recap-dialog'));
          assert.ok(js.includes('rs-recap-preview'));
          assert.ok(css.includes('dialog.rs-recap-dialog::backdrop'));
          assert.ok(!js.includes('group("이미지 비율"'));
          assert.ok(fs.readFileSync('src/ride-recap.mjs','utf8').includes('width:920,height:920'));
          assert.ok(fs.readFileSync('edge/static-edge.mjs','utf8').includes('rs-recovery-guard-v217'));
          assert.ok(m.files.includes('/assets/rider-spot-'+m.hash+'/daily-timeline.css'));
          console.log('SQUARE_RECAP_STAGE_VALIDATED',m.hash);
          NODE
      - name: Commit tested immutable assets for Cloudflare
        working-directory: rider-spot-web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prebuilt
          for name in index.html sw.js release.json; do cp "dist/$name" "prebuilt/$name"; done
          release=$(node -p "require('./dist/release.json').hash")
          asset_dir="dist/assets/rider-spot-$release"
          for name in app.mjs route-worker.mjs native-gps.js map-reports.js design-system.css \
            workspace-tools.js tab-resume.js daily-timeline.css weather-bar.js weather-bar.css \
            premium-shell.css renewal-layout.css curated-v9.css; do
            test -s "$asset_dir/$name"
            cp "$asset_dir/$name" "prebuilt/$name"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A prebuilt/
          if git diff --cached --quiet; then
            echo "Already staged: $release"
            exit 0
          fi
          git fetch origin feature/rider-spot-native-apk
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feature/rider-spot-native-apk)" ]]; then
            echo "Branch advanced; abort stale asset stage"
            exit 1
          fi
          git commit -m "chore(recap): stage validated square-map assets [skip ci]"
          git push origin HEAD:feature/rider-spot-native-apk
