name: Rider Spot fix repeated native trip restoration
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-native-finalization-guard.yml'
      - 'rider-spot-android/patch-native-finalization-loop.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-native-finalization-guard
  cancel-in-progress: false
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - name: Apply guarded fix to archived native source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rider-spot-fix
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rider-spot-fix
          python3 rider-spot-android/patch-native-finalization-loop.py /tmp/rider-spot-fix
          grep -q 'function isTripCompleted' /tmp/rider-spot-fix/app/src/main/assets/native-bridge.js
          grep -q 'versionCode 12' /tmp/rider-spot-fix/app/build.gradle
          ! grep -q 'location.reload(' /tmp/rider-spot-fix/app/src/main/assets/native-bridge.js
      - name: Preserve native recovery tests
        working-directory: /tmp/rider-spot-fix
        run: node --test tests/*.test.cjs
      - name: Verify replayed stopped trip cannot restore after completion
        working-directory: /tmp/rider-spot-fix
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const s=fs.readFileSync('app/src/main/assets/native-bridge.js','utf8');
          assert.match(s,/function isTripCompleted\(userId, id\)/);
          assert.match(s,/if \(isTripCompleted\(userId, id\)\) \{/);
          assert.match(s,/const record = readActiveTrip\(userId, id\)/);
          assert.match(s,/\['rs:active:' \+ userId, 'active:' \+ userId\]/);
          assert.ok(!s.includes('location.reload('));
          console.log('PASS: completed trip is never restored by periodic bridge reconciliation');
          NODE
      - name: Freeze verified native source and readable audit
        shell: bash
        run: |
          set -euo pipefail
          tar -cJf rider-spot-android/source.tar.xz -C /tmp/rider-spot-fix .
          mkdir -p rider-spot-android/audit
          cp /tmp/rider-spot-fix/app/src/main/assets/native-bridge.js rider-spot-android/audit/native-bridge.js.txt
          cp /tmp/rider-spot-fix/app/build.gradle rider-spot-android/audit/build.gradle.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-android/source.tar.xz rider-spot-android/audit
          if ! git diff --cached --quiet; then
            git commit -m 'fix(android): stop repeated restore/finalize of lastStoppedId [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
