name: Rider Spot government office names
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-government-labels.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-government-map-import
  cancel-in-progress: false
jobs:
  build-government-names:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test government location and name verification
        run: python3 -m unittest discover -s tests -p 'test_korean_government.py' -v
      - name: Build government names from 2026 SEMAS buildings and OSM
        run: python3 scripts/refresh-korean-government.py
      - name: Validate separate government dataset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path("data/korean-map")
          data=json.loads((base/"government.json").read_text())
          manifest=json.loads((base/"manifest.json").read_text())
          assert len(data)>=8
          assert manifest["counts"]["government"]==len(data)
          assert "2026-09" in manifest["sources"]["shop"]
          assert all(len(row)==4 and row[3]=="government" and 126.68<=row[0]<=127.13 and 34.98<=row[1]<=35.36 for row in data)
          print("PASS government names:",len(data))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - name: Commit only verified government text dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/korean-map/government.json data/korean-map/manifest.json data/korean-map/bundles/pack-00.json
          if git diff --cached --quiet; then
            echo 'Government label data unchanged'
            exit 0
          fi
          git commit -m 'data(map): add verified public government name labels [skip ci]'
          git fetch origin feature/rider-spot-native-apk
          git rebase origin/feature/rider-spot-native-apk
          git push origin HEAD:feature/rider-spot-native-apk
