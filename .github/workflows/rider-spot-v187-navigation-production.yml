name: Rider Spot v187 navigation production smoke
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v187-navigation-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify live web navigation, animation, intact native GPS assets and map
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://rider-spot.jazzhjm.workers.dev',hash='7daff546a614';
          assert.equal(JSON.parse(fs.readFileSync('prebuilt/release.json','utf8')).hash,hash);
          const paths=[['/','index.html'],['/sw.js','sw.js'],...['app.mjs','design-system.css','tab-resume.js'].map(n=>['/assets/rider-spot-'+hash+'/'+n,n])];
          for(const [route,file] of paths){
            const r=await fetch(base+route,{headers:{'Cache-Control':'no-cache'}});
            assert.equal(r.status,200,route+' HTTP '+r.status);
            const live=await r.text();
            assert.equal(live,fs.readFileSync('prebuilt/'+file,'utf8'),route+' differs from approved candidate');
            if(file==='app.mjs')assert.ok(live.includes('__rsHandleBack')&&live.includes('data:image/png;base64,'),'navigation and icons are live');
            if(file==='design-system.css')assert.ok(live.includes('rs187-sheet-enter')&&live.includes('prefers-reduced-motion'),'sheet animation not live');
            if(file==='tab-resume.js')assert.ok(live.includes('riderspot:tab-restored'),'tab resume not live');
            console.log('PASS live',route,live.length);
          }
          for(const p of ['/assets/rider-spot-'+hash+'/native-gps.js','/assets/rider-spot-'+hash+'/route-worker.mjs',
            '/assets/rider-spot-'+hash+'/workspace-tools.js','/mapdata/manifest.json']){
            const r=await fetch(base+p);
            assert.equal(r.status,200,p);
            if(p.includes('manifest.json'))assert.ok((await r.json()).counts);
            console.log('PASS live preserved',p);
          }
          NODE
