name: Rider Spot v188 side-by-side safe test APK
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v188-safe-test-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare separate app ID so installed original and local GPS history are untouched
        run: |
          set -euo pipefail
          mkdir -p /tmp/rider-v188-test
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rider-v188-test
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/rider-v188-test')
          activity=root/'app/src/main/java/com/riderspot/android/MainActivity.java'
          assert 'getOnBackInvokedDispatcher' in activity.read_text()
          gradle=root/'app/build.gradle'
          g=gradle.read_text()
          assert g.count('defaultConfig {')==1,'unexpected Gradle configuration'
          g=g.replace('defaultConfig {','defaultConfig {\n        applicationIdSuffix \".preview188\"',1)
          gradle.write_text(g)
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          m,n=re.subn(r'android:label=\"[^\"]+\"','android:label=\"Rider Spot v188 테스트\"',m,count=1)
          assert n==1,'app label not found'
          manifest.write_text(m)
          print('PASS safe parallel applicationIdSuffix preview188; native Back handler intact')
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Native GPS regression tests
        working-directory: /tmp/rider-v188-test
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android 36 SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Build separate test APK without uninstalling or changing original application
        working-directory: /tmp/rider-v188-test
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RiderSpot-v188-Parallel-TEST
          path: /tmp/rider-v188-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
