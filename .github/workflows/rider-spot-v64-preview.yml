name: Rider Spot v65 preview browser acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v64-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Prepare synthetic fixture, without touching production records
        run: |
          sed -i 's/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/' tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
      - name: Verify actual deployed candidate at mobile widths and WebView
        env:
          RIDER_UI_URL: https://cc559935-rider-spot.jazzhjm.workers.dev/
        run: node tests/ui-browser.cjs
      - name: Journey regression at production candidate
        env:
          RIDER_UI_URL: https://cc559935-rider-spot.jazzhjm.workers.dev/
        run: node tests/journey-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-v65-preview-evidence
          path: |
            /tmp/rider-ui-evidence
            /tmp/rider-journey-evidence
          retention-days: 14
