name: Rider Spot preserve WebView across Android configuration changes
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-webview-config-guard.yml'
      - 'rider-spot-android/patch-webview-config.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-native-config-guard
  cancel-in-progress: false
jobs:
  patch-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - name: Patch Android config without changing GPS or storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs-native-src
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rs-native-src
          python3 rider-spot-android/patch-webview-config.py /tmp/rs-native-src
          tar -cJf rider-spot-android/source.tar.xz -C /tmp/rs-native-src .
          test -s rider-spot-android/source.tar.xz
          tar -xJOf rider-spot-android/source.tar.xz ./app/src/main/AndroidManifest.xml | grep -q 'smallestScreenSize|screenLayout'
      - name: Persist patched Android source and trigger existing APK build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-android/source.tar.xz
          git diff --cached --stat
          git commit -m 'fix(android): prevent WebView reconstruction on display configuration changes'
          git pull --rebase origin feature/rider-spot-native-apk
          git push origin HEAD:feature/rider-spot-native-apk
