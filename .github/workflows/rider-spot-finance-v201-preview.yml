name: Rider Spot finance v201 live preview verification
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-finance-v201-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare actual Cloudflare v201 preview assets with tested build
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const origin='https://9b6340b9-rider-spot.jazzhjm.workers.dev';
          const release=JSON.parse(fs.readFileSync('rider-spot-web/prebuilt/release.json','utf8'));
          assert.equal(release.hash,'8722232450b9');
          const base='/assets/rider-spot-'+release.hash+'/';
          const list=[['/','index.html'],['/index.html','index.html'],['/sw.js','sw.js'],
            ...['app.mjs','route-worker.mjs','native-gps.js','map-reports.js','design-system.css',
                'workspace-tools.js','tab-resume.js','daily-timeline.css'].map(name=>[base+name,name])];
          for(const [url,file] of list){
            const res=await fetch(origin+url,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(res.status,200,'unexpected HTTP '+res.status+' on '+url);
            const actual=await res.text();
            const expected=fs.readFileSync('rider-spot-web/prebuilt/'+file,'utf8');
            assert.equal(actual,expected,'bytes differ: '+url);
            console.log('PASS',url,actual.length);
          }
          const map=await fetch(origin+'/mapdata/manifest.json',{signal:AbortSignal.timeout(20000)});
          assert.equal(map.status,200,'Korean map dataset missing');
          assert.ok((await map.json()).counts,'map source manifest not preserved');
          const old=await fetch(origin+'/assets/rider-spot-464d5adce020/app.mjs',{signal:AbortSignal.timeout(20000)});
          assert.equal(old.status,200,'previous published app bundle removed');
          console.log('PASS preview 8722232450b9 + previous assets');
          NODE
