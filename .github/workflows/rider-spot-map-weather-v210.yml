name: Rider Spot v210 map and weather layout candidate
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-map-weather-v210.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-map-weather-v210
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check weather details, credit labels, and production asset compatibility
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const release=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const base='dist/assets/rider-spot-'+release.hash+'/';
          const weather=fs.readFileSync(base+'weather-bar.js','utf8');
          const css=fs.readFileSync(base+'weather-bar.css','utf8');
          const map=fs.readFileSync(base+'map-reports.js','utf8');
          const html=fs.readFileSync('dist/index.html','utf8');
          const sw=fs.readFileSync('dist/sw.js','utf8');
          assert.ok(weather.includes('rs-weather-head'), 'broken dark global header still present');
          assert.ok(weather.includes('rs-weather-sheet'), 'weather modal not scoped');
          assert.ok(!weather.includes('createElement("header")'), 'old conflicting header markup');
          for(const needle of ['.rs-weather-sheet .rs-weather-head','.rs-public-poi-credit','.ride-launch.active button'])assert.ok(css.includes(needle),needle);
          assert.ok(map.includes('OpenStreetMap'), 'OSM attribution missing');
          assert.ok(fs.readFileSync('src/map-reports.js','utf8').includes('"제보 " + records.length'), 'reported toilet source count ambiguous');
          assert.ok(fs.readFileSync('src/public-pois-overlay.mjs','utf8').includes('"공공 " + visible.length'), 'public toilet source count ambiguous');
          assert.ok(html.includes('weather-bar.js') && html.includes('weather-bar.css'));
          assert.ok(sw.includes('weather-bar.js'));
          fs.mkdirSync('prebuilt-weather-v210',{recursive:true});
          for(const file of ['weather-bar.js','weather-bar.css','map-reports.js']) fs.copyFileSync(base+file,'prebuilt-weather-v210/'+file);
          fs.writeFileSync('prebuilt-weather-v210/release.json',JSON.stringify({hash:release.hash,source:process.env.GITHUB_SHA,files:['weather-bar.js','weather-bar.css','map-reports.js']},null,2));
          console.log('PASS v210 isolated UI candidate',release.hash,weather.length,css.length,map.length);
          NODE
      - name: Persist the isolated map/weather candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt-weather-v210
          if ! git diff --cached --quiet; then
            git commit -m 'build: freeze verified v210 weather and map polish [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RiderSpot-v210-weather-map
          path: rider-spot-web/prebuilt-weather-v210/
          retention-days: 7
