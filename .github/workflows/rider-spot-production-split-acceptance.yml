name: Rider Spot production split migration immediate acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-production-split-acceptance.yml'
      - 'rider-spot-web/scripts/verify-production-migration.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare live 100 percent route responses, OAuth and fallback to verified staging
        run: node scripts/verify-production-migration.mjs
      - name: Verify actual production mobile tab, layout and no unwanted reload
        env:
          RIDER_STATIC_PREVIEW_ORIGIN: https://rider-spot.jazzhjm.workers.dev/
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node tests/static-preview-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-live-split-migration-qa
          path: |
            rider-spot-web/production-migration-qa.json
            rider-spot-web/docs/static-preview-browser-qa.json
          if-no-files-found: ignore
