name: Rider Spot v188 Android 17 Back callback + sheet motion
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-v188-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-v188-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore native source and register Android 13+ predictive Back callback
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs-v188
          tar -xJf rider-spot-android/source.tar.xz -C /tmp/rs-v188
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/rs-v188')
          activity=root/'app/src/main/java/com/riderspot/android/MainActivity.java'
          text=activity.read_text()
          old='        super.onCreate(savedInstanceState);'
          assert text.count(old)==1
          reg='''        super.onCreate(savedInstanceState);
                  // Android 13+ gesture Back may bypass onBackPressed() entirely.
                  // Route both predictive gestures and the legacy key to the same SPA handler.
                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                          android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                          () -> dispatchRiderBack());
                  }'''
          text=text.replace(old,reg)
          old='''    @Override public void onBackPressed() {
                  if (webView == null)'''
          new='''    @Override public void onBackPressed() { dispatchRiderBack(); }

              private void dispatchRiderBack() {
                  if (webView == null)'''
          assert text.count(old)==1, 'v187 Android Back method unexpectedly changed'
          text=text.replace(old,new)
          assert text.count('private void dispatchRiderBack()')==1
          assert 'window.__rsHandleBack' in text
          assert 'confirmExitFromBack' in text
          activity.write_text(text)
          print('PASS modern Android Back and old physical key converge on WebView stack')
          PY
          grep -q 'getOnBackInvokedDispatcher' /tmp/rs-v188/app/src/main/java/com/riderspot/android/MainActivity.java
          grep -q 'dispatchRiderBack()' /tmp/rs-v188/app/src/main/java/com/riderspot/android/MainActivity.java
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve native GPS and bridge contract
        working-directory: /tmp/rs-v188
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Compile and verify installable APK
        working-directory: /tmp/rs-v188
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Save v188 native source to repository
        run: |
          set -euo pipefail
          test -s /tmp/rs-v188/app/build/outputs/apk/debug/app-debug.apk
          tar --exclude='./app/build' --exclude='./.gradle' -cJf rider-spot-android/source.tar.xz -C /tmp/rs-v188 .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-android/source.tar.xz
          if ! git diff --cached --quiet; then
            git commit -m 'fix(android): intercept Android 13-17 gesture Back via dispatcher [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RiderSpot-Android-v188-gesture-back-debug
          path: /tmp/rs-v188/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
