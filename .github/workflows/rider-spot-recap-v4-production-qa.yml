name: Rider Spot recap v4 production HTTP and mobile acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-recap-v4-production-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - name: Dependencies
        run: npm ci
      - name: Verify production asset bytes, API continuity, old WebViews and map
        id: http
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://rider-spot.jazzhjm.workers.dev';
          const hash='5f6c1d27b651';
          const get=async p=>{
            let error;
            for(let i=0;i<5;i++){
              try{
                const r=await fetch(base+p,{headers:{'user-agent':'RiderSpot-ProductionV4-Verify','cache-control':'no-cache'},signal:AbortSignal.timeout(40000)});
                assert.equal(r.status,200,p+' HTTP '+r.status);
                return await r.text();
              }catch(e){error=e;await new Promise(resolve=>setTimeout(resolve,1700));}
            }
            throw error;
          };
          const index=await get('/');
          assert.ok(index.includes('/assets/rider-spot-'+hash+'/app.mjs'),'Production still on old UI');
          assert.ok(index.includes('rs-recovery-guard-v217'),'WebView recovery guard missing');
          assert.equal(await get('/sw.js'),fs.readFileSync('prebuilt/sw.js','utf8'));
          for(const file of ['app.mjs','daily-timeline.css','native-gps.js','design-system.css','curated-v9.css']){
            const value=await get('/assets/rider-spot-'+hash+'/'+file);
            assert.equal(value,fs.readFileSync('prebuilt/'+file,'utf8'),file+' bytes differ');
          }
          for(const old of ['228abe877a8d','9263bc477e45','d7fd89a7c39a']){
            const bytes=await get('/assets/rider-spot-'+old+'/app.mjs');
            assert.ok(bytes.length>100000,'Older Android runtime missing '+old);
          }
          const manifest=JSON.parse(await get('/mapdata/manifest.json'));
          assert.ok(manifest.counts,'map data unavailable');
          assert.ok((await get('/rider-spot-shell-v40.js')).length>100,'legacy native shell unavailable');
          console.log('RECAP_V4_PRODUCTION_HTTP_PASS',hash);
          NODE
      - name: Install Chromium
        id: chromium
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Production 360px and 393px PNG dialogs
        id: dialog
        continue-on-error: true
        env:
          RIDER_UI_URL: https://rider-spot.jazzhjm.workers.dev/
        run: node tests/ride-recap-dialog-browser.cjs
      - name: Production mobile boot no unexpected reload
        id: reload
        continue-on-error: true
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const width of [360,393]){
                const ctx=await browser.newContext({viewport:{width,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block',timezoneId:'Asia/Seoul'});
                await ctx.addInitScript(()=>{
                  const key='__rs_prod_v4_boots';
                  sessionStorage.setItem(key,String(Number(sessionStorage.getItem(key)||0)+1));
                });
                const page=await ctx.newPage(),errors=[];
                page.on('pageerror',err=>errors.push(err.message));
                await page.goto('https://rider-spot.jazzhjm.workers.dev/',{waitUntil:'domcontentloaded',timeout:40000});
                const nav=page.locator('.bottom-nav button');
                await nav.first().waitFor({timeout:30000});
                for(const index of [1,2,3,4,0]){
                  if(index<(await nav.count()))await nav.nth(index).click();
                  await page.waitForTimeout(170);
                }
                await page.waitForTimeout(500);
                const data=await page.evaluate(()=>({boots:Number(sessionStorage.getItem('__rs_prod_v4_boots')),
                  overflow:document.documentElement.scrollWidth>innerWidth+2}));
                assert.equal(data.boots,1,'unexpected reload '+width);
                assert.equal(data.overflow,false,'horizontal overflow '+width);
                assert.deepEqual(errors,[],'browser page errors '+width);
                console.log('PRODUCTION_V4_MOBILE_NO_RELOAD_PASS',width,data);
                await ctx.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rider-spot-recap-v4-production-evidence
          path: /tmp/rider-spot-recap
          if-no-files-found: warn
          retention-days: 14
      - name: Commit reviewed production outcome
        if: always()
        working-directory: .
        env:
          PROD_HTTP: ${{ steps.http.outcome }}
          PROD_CHROMIUM: ${{ steps.chromium.outcome }}
          PROD_DIALOG: ${{ steps.dialog.outcome }}
          PROD_RELOAD: ${{ steps.reload.outcome }}
        run: |
          set -eu
          mkdir -p rider-spot-web/docs
          {
            echo '# Recap v4 real production verification'
            echo ''
            echo '- Production: https://rider-spot.jazzhjm.workers.dev/'
            echo '- Release: 5f6c1d27b651'
            echo '- Workflow: https://github.com/winzfs/riderapp/actions/runs/${{ github.run_id }}'
            echo '- Production HTTP byte-level/legacy/PWA: '$PROD_HTTP
            echo '- Chromium installed: '$PROD_CHROMIUM
            echo '- Production 360px and 393px dialog: '$PROD_DIALOG
            echo '- Production mobile no-reload: '$PROD_RELOAD
          } > rider-spot-web/docs/recap-v4-production-status.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-web/docs/recap-v4-production-status.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(recap): archive v4 production HTTP and mobile QA [skip ci]'
          git fetch origin feature/rider-spot-native-apk
          git rebase origin/feature/rider-spot-native-apk
          git push origin HEAD:feature/rider-spot-native-apk
      - name: Fail deployment acceptance when any check failed
        if: always()
        env:
          RESULTS: ${{ steps.http.outcome }} ${{ steps.chromium.outcome }} ${{ steps.dialog.outcome }} ${{ steps.reload.outcome }}
        run: |
          echo "$RESULTS"
          test "$RESULTS" = "success success success success"
