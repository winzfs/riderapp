name: Rider Spot angular PNG candidate CSS diagnosis
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-angular-icon-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture applied PNG URL, style rule and maintenance regression
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tests/mobile-records-browser.cjs';
          let s=fs.readFileSync(path,'utf8');
          s=s.replace('const origin="https://rider-spot.jazzhjm.workers.dev";','const origin="https://bd7338b3-rider-spot.jazzhjm.workers.dev";');
          const old='    assert.match(await pngIcon.evaluate(el => getComputedStyle(el).backgroundImage), /data:image\\/png;base64,/,';
          const updated=`    const debug=await pngIcon.evaluate(el => ({
            computed:getComputedStyle(el).backgroundImage.slice(0,160),
            inline:el.style.backgroundImage.slice(0,110),
            styleText:document.getElementById('rs-angular-maintenance')?.textContent.slice(0,400),
            parsed:document.getElementById('rs-angular-maintenance')?.sheet?.cssRules?.[0]?.cssText?.slice(0,300)
          }));
          console.log('ANGULAR ICON DIAG',JSON.stringify(debug));
          assert.match(debug.computed,/angular-parts-44febf5\\.png/,`;
          if(!s.includes(old))throw Error('Expected test source not found');
          s=s.replace(old,updated);
          fs.writeFileSync(path,s);
          NODE
          node tests/mobile-records-browser.cjs
