name: Rider Spot UIUX v34 freeze validated immutable assets
on:
  push:
    branches: [design/riderspot-uiux-v34-rearchitecture-20261123]
    paths: [.github/workflows/rider-spot-uiux-v34-freeze.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-uiux-v34-freeze
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run: {working-directory: rider-spot-web}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm,cache-dependency-path: rider-spot-web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Freeze all 13 versioned assets and consistent shell
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const rel=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const dir=path.join('dist','assets','rider-spot-'+rel.hash);
          const names=['app.mjs','route-worker.mjs','native-gps.js','map-reports.js',
            'design-system.css','workspace-tools.js','tab-resume.js','daily-timeline.css',
            'weather-bar.js','weather-bar.css','premium-shell.css','renewal-layout.css','curated-v9.css'];
          assert.equal(rel.files.filter(x=>x.startsWith('/assets/')).length,13);
          for(const file of names){
            const source=path.join(dir,file);
            assert.ok(fs.statSync(source).size>100,file);
            fs.copyFileSync(source,path.join('prebuilt',file));
          }
          for(const file of ['index.html','sw.js','release.json'])
            fs.copyFileSync(path.join('dist',file),path.join('prebuilt',file));
          const html=fs.readFileSync('prebuilt/index.html','utf8');
          const css=fs.readFileSync('prebuilt/curated-v9.css','utf8');
          const app=fs.readFileSync('prebuilt/app.mjs','utf8');
          assert.ok(html.includes('/assets/rider-spot-'+rel.hash+'/app.mjs'));
          assert.ok(css.includes('RIDERSPOT V34 REARCHITECTURE'));
          assert.ok(app.includes('rs34-app'));
          console.log('V34_FREEZE_OK',rel.hash,names.length);
          NODE
      - name: Pin tested release to this design branch
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f rider-spot-web/prebuilt
          if git diff --cached --quiet; then
            echo 'Identical assets already frozen.'; exit 0
          fi
          git commit -m 'build(uiux): freeze RiderSpot v34 verified web assets [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RiderSpot-v34-frozen-release
          path: |
            rider-spot-web/prebuilt/release.json
            rider-spot-web/dist/release.json
          retention-days: 14
