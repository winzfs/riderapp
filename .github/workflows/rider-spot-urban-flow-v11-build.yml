name: Rider Spot URBAN FLOW v11 structural build and regression
on:
  push:
    branches: [feature/rider-spot-v11-full-rearchitecture, feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-urban-flow-v11-build.yml'
      - 'rider-spot-web/src/mobile-records.mjs'
      - 'rider-spot-web/tests/mobile-records-browser.cjs'
      - 'rider-spot-web/tests/urban-flow-v11-browser.cjs'
      - 'rider-spot-web/src/Timeline.mjs'
      - 'rider-spot-web/src/curated-v9.css'
      - 'rider-spot-web/src/application.mjs'
      - 'rider-spot-web/src/finance-ui.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-urban-flow-v11-build
  cancel-in-progress: false
jobs:
  verify-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assert actual v9 React DOM, immutable CSS and functional controls
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const base='dist/assets/rider-spot-'+r.hash+'/';
          const html=fs.readFileSync('dist/index.html','utf8');
          const sw=fs.readFileSync('dist/sw.js','utf8');
          const style=fs.readFileSync(base+'curated-v9.css','utf8');
          const app=fs.readFileSync(base+'app.mjs','utf8');
          assert.match(style,/URBAN FLOW v11/);
          assert.match(style,/rs11-service-list/);
          assert.match(style,/rs11-income-chart/);
          assert.ok(!style.includes("background:var(--ns-ink)!important"),"previous black-theme styles must not ship");
          assert.match(style,/rs8-bike-hero/);
          assert.match(style,/rs9-chart-heading/);
          assert.ok(!style.includes("#172923;border:0;border-radius:15px;box-shadow:none;color:#FFF;isolation:isolate"),"old black hero forbidden");
          assert.match(style,/rs8-income-console/);
          assert.match(html,new RegExp('/assets/rider-spot-'+r.hash+'/curated-v9\\.css'));
          assert.match(sw,new RegExp('/assets/rider-spot-'+r.hash+'/curated-v9\\.css'));
          assert.match(fs.readFileSync('edge/static-edge.mjs','utf8'),/rs-recovery-guard-v217/);
          assert.match(fs.readFileSync('edge/static-edge.mjs','utf8'),/20261121-v9/);
          for(const marker of [
            'rs8-map-overlay','rs8-map-tools','rs8-community-tools','rs9-community-title','rs9-chart-heading',
            'rs8-income-console','rs8-console-value','rs11-income-chart','rs11-finance-shortcuts',
            'rs8-analysis-lead','rs8-settlement-hero','rs8-zero-maintenance',
            'rs8-bike-hero','rs8-bike-settings','rs8-service-alerts','rs11-service-list','rs11-part-row',
            'rs6-service-board','rs6-history-board','rs6-timeline-controller',
            'rs7-map-label','rs6-community-feed-head','rs11-map-commandbar','rs11-route-first'
          ])assert.ok(app.includes(marker),'Missing actual v9 React element '+marker);
          for(const removed of ['EARNINGS / 01','GARAGE / 02','DAILY ROUTES / 03','LOCAL / 04','YOUR ROUTE']){
            assert.ok(!app.includes(removed),'Unwanted decoration still present: '+removed);
          }
          console.log('URBAN_FLOW_V11_BUILD_PASS',r.hash,style.length,app.length);
          NODE
      - name: Check ride, map camera, tab resume and Android WebView recovery safety
        run: |
          mkdir -p /tmp/rider-v11-native
          tar -xJf ../rider-spot-android/source.tar.xz -C /tmp/rider-v11-native
          RIDER_ANDROID_SOURCE=/tmp/rider-v11-native node scripts/check-update-safety.mjs
      - run: npx playwright install chromium
      - name: Synthetic finance, bike CRUD, and native bridge
        run: |
          python3 -m http.server 8840 --directory dist >/tmp/rider-v11-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8840/ >/dev/null; then break; fi
            sleep 1
          done
          RIDER_VISUAL_URL=http://127.0.0.1:8840 node tests/urban-flow-v11-browser.cjs
          RIDER_TEST_ORIGIN=http://127.0.0.1:8840 RIDER_SCREENSHOTS=/tmp/rider-v11-build-evidence node tests/mobile-records-browser.cjs
          RIDER_TEST_URL=http://127.0.0.1:8840 RIDER_TEST_CASE=native RIDER_APK_BRIDGE=/tmp/rider-v11-native/app/src/main/assets/native-bridge.js node tests/browser.cjs
      - name: Freeze validated CSS, JSX and WebView-safe assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const r=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const dir='dist/assets/rider-spot-'+r.hash;
          const names=['app.mjs','route-worker.mjs','native-gps.js','map-reports.js',
            'design-system.css','workspace-tools.js','tab-resume.js','daily-timeline.css',
            'weather-bar.js','weather-bar.css','premium-shell.css','renewal-layout.css','curated-v9.css'];
          for(const name of names)fs.copyFileSync(path.join(dir,name),path.join('prebuilt',name));
          for(const name of ['index.html','sw.js','release.json'])
            fs.copyFileSync(path.join('dist',name),path.join('prebuilt',name));
          console.log('URBAN_FLOW_V11_FROZEN',r.hash,names.length+3);
          NODE
      - name: Commit frozen release assets
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-web/prebuilt
          if ! git diff --cached --quiet; then
            git commit -m 'build: freeze URBAN FLOW v11 structural app assets [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-urban-flow-v11-build-evidence
          path: |
            rider-spot-web/dist/release.json
            /tmp/rider-v11-build-evidence
          retention-days: 7
          if-no-files-found: warn

