name: Rider Spot isolated backend staging acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-backend-staging-qa.yml'
      - 'rider-spot-web/scripts/verify-backend-staging.mjs'
      - 'rider-spot-web/tests/mobile-records-browser.cjs'
      - 'rider-spot-web/src/premium-shell.css'
      - 'rider-spot-web/wrangler.kv-front-preview.json'
      - 'rider-spot-web/wrangler.static-preview.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify preview settings and routing tests
        run: node --test tests/kv-preview-config.test.mjs tests/static-edge.test.mjs
      - name: Check public staged backend responses (read-only)
        run: node scripts/verify-backend-staging.mjs
      - name: Verify real 320 / 393 / 412px mobile navigation, layout and refresh stability
        run: node tests/static-preview-browser.cjs
      - name: Verify authenticated finance, maintenance, route UI through local-only fixtures
        env:
          RIDER_TEST_ORIGIN: https://rider-spot-static-preview.jazzhjm.workers.dev
          RIDER_SCREENSHOTS: /tmp/rider-spot-isolated-ui
        run: |
          npm run build
          node tests/mobile-records-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-backend-staging-qa
          path: |
            rider-spot-web/backend-staging-qa.json
            rider-spot-web/docs/static-preview-browser-qa.json
            /tmp/rider-spot-isolated-ui/
          if-no-files-found: ignore
