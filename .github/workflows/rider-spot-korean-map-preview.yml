name: Rider Spot Korean map preview acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-korean-map-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_UI_URL: https://da25a7e5-rider-spot.jazzhjm.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - name: Diagnose preview HTTP responses
        shell: bash
        run: |
          for target in https://da25a7e5-rider-spot.jazzhjm.workers.dev/ https://a8340454-rider-spot.jazzhjm.workers.dev/ https://da25a7e5-rider-spot.jazzhjm.workers.dev/mapdata/manifest.json; do
            echo "Probe: $target"
            curl -sSL --max-time 20 -A 'Mozilla/5.0 RiderSpot-QA' -D /tmp/rs-headers -o /tmp/rs-body "$target" || true
            head -n 12 /tmp/rs-headers
            head -c 150 /tmp/rs-body
            echo
          done
      - name: Check live preview, region names and real store tiles
        run: |
          python3 - <<'PY'
          import json, urllib.request
          root = 'https://da25a7e5-rider-spot.jazzhjm.workers.dev'
          def load(path):
            request = urllib.request.Request(root + path, headers={'User-Agent':'Mozilla/5.0 RiderSpot-QA','Accept':'application/json,text/html,*/*'})
            with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 200, (path, response.status)
              payload = response.read()
              if path.endswith('.json'):
                assert 'application/json' in response.headers.get('Content-Type', ''), path
                return json.loads(payload)
              return payload.decode('utf-8')
          html = load('/')
          assert '77c6e9330124' in html, 'Expected new release missing'
          manifest = load('/mapdata/manifest.json')
          assert manifest['coverage'] == '광주광역시'
          assert manifest['counts']['shop'] == 76391, manifest['counts']
          assert manifest['counts']['building'] == 5106, manifest['counts']
          assert manifest['counts']['apartment'] == 546, manifest['counts']
          assert '2026-09' in manifest['sources']['shop'], 'Still using old business data'
          assert '2026-09' in manifest['sources']['building'], 'Still using old building source'
          admin = load('/mapdata/admin.json')
          assert len(admin) >= 100
          shops = load('/mapdata/t3170-879.json')
          assert any(row[3] == 'shop' for row in shops)
          offices = load('/mapdata/government.json')
          assert len(offices) == 241, ('Unexpected government label count', len(offices))
          assert any(x[2]=='광산구청' and x[3]=='government' for x in offices)
          assert not any('가사문학면' in x[2] for x in offices), 'Outside city boundary'
          assert not any('KT&G' in x[2] for x in offices), 'Private company mislabeled'
          assert manifest['counts']['government'] == len(offices)
          app = load('/assets/rider-spot-77c6e9330124/app.mjs')
          assert 'rs-public-apartment-label' in app
          assert 'rs-public-government-label' in app
          assert 'rs-korean-government-names' in app
          assert 'rs47-gwangsan-overview' not in app, 'Legacy manual dong names still bundled'
          assert 'within' in app, 'Missing geographic label de-duplication'
          print('PASS preview: regions',len(admin),'businesses',manifest['counts']['shop'],'tile samples',len(shops))
          PY
      - run: npx playwright install --with-deps chromium
      - name: Run live mobile UI and timeline acceptance
        shell: bash
        run: |
          sed -i 's/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/' tests/ui-browser.cjs
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
          node tests/ui-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-korean-map-preview-evidence
          path: /tmp/rider-ui-evidence
          retention-days: 14
