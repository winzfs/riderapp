name: Rider Spot v217 Cloudflare deployment credential status
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-cf-status-v217.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - name: Detect availability only, never print credentials
        env:
          CF_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_B: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_A" || -n "$CF_B" ]]; then
            RESULT=available
          else
            RESULT=unavailable
          fi
          if [[ -n "$CF_ACCOUNT" ]]; then ACCOUNT=available; else ACCOUNT=unavailable; fi
          printf 'api_token=%s account_id=%s\n' "$RESULT" "$ACCOUNT" > rider-spot-web/v217-cloudflare-status.txt
      - name: Publish only boolean status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-web/v217-cloudflare-status.txt
          git commit -m 'ci(debug): report availability of deployment credentials [skip ci]'
          git pull --rebase origin feature/rider-spot-native-apk
          git push origin HEAD:feature/rider-spot-native-apk
