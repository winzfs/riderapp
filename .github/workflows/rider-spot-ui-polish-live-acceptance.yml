name: Rider Spot map-timeline UI polish live acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-ui-polish-live-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_LIVE_URL: https://rider-spot.jazzhjm.workers.dev
      RIDER_VISUAL_URL: https://rider-spot.jazzhjm.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - name: Verify live release hash, UI assets, old hash and Worker routes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const host=process.env.RIDER_LIVE_URL,hash='e57e73fe3534',oldHash='57888bba6c49';
          const get=async(path)=>{
            const r=await fetch(host+path,{headers:{'cache-control':'no-cache'}});
            assert.equal(r.status,200,path+': HTTP '+r.status);
            return r.text();
          };
          const index=await get('/');
          assert.ok(index.includes('/assets/rider-spot-'+hash+'/app.mjs'),'Live shell not promoted');
          const base='/assets/rider-spot-'+hash+'/';
          const [app,css,tools,reports,sw,old]=await Promise.all([
            get(base+'app.mjs'),get(base+'curated-v9.css'),
            get(base+'workspace-tools.js'),get(base+'map-reports.js'),
            get('/sw.js'),get('/assets/rider-spot-'+oldHash+'/curated-v9.css')
          ]);
          assert.ok(app.includes('rs-map-report'),'Report menu not released');
          assert.ok(app.includes('rs-map-finish-secondary'),'New map ride controls not released');
          assert.ok(app.includes('rs-ride-controls-top'),'Timeline stop action not released');
          assert.ok(css.includes('rs-map-share-notice')&&css.includes('rs-ride-controls-top'),'Missing UI polish stylesheet');
          assert.ok(tools.includes('rs-presence-panel')&&tools.includes('lifebuoy'),'Status and help icons unavailable');
          assert.ok(reports.includes('rs-map-share-notice'),'Source attribution notice not released');
          assert.ok(sw.includes(hash),'Service worker hash mismatch');
          assert.ok(old.length>15000,'Old immutable assets lost');
          console.log('LIVE_UI8_HTTP_PASS',JSON.stringify({hash,appBytes:app.length,cssBytes:css.length,oldBytes:old.length}));
          NODE
      - run: npm ci
      - run: npx playwright install chromium
      - name: Live map, timeline and tab stability on phone widths
        run: node tests/urban-flow-v11-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-ui-polish-live-shots
          path: /tmp/rider-spot-urban-flow-v11/
          if-no-files-found: warn
          retention-days: 14
