name: Rider Spot NIGHT SHIFT v10 live preview acceptance
on:
  push:
    branches: [feature/rider-spot-v10-redesign]
    paths:
      - '.github/workflows/rider-spot-v10-preview-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-night-shift-v10-acceptance
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_ORIGIN: https://rider-spot-night-shift-v10-preview.jazzhjm.workers.dev
      RIDER_TEST_REMOTE_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - name: Verify final v10 asset generation and previous in-use hashes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const release=JSON.parse(fs.readFileSync('prebuilt/release.json','utf8'));
          assert.equal(release.hash,'66179994a862');
          const get=async path=>{
            const r=await fetch(process.env.RIDER_ORIGIN+path,{signal:AbortSignal.timeout(45000)});
            assert.equal(r.status,200,'Asset or shell missing: '+path);
            return r;
          };
          const shell=await (await get('/')).text();
          assert.ok(shell.includes('/assets/rider-spot-'+release.hash+'/app.mjs'));
          assert.ok(shell.includes('/assets/rider-spot-'+release.hash+'/curated-v9.css'));
          assert.ok(shell.includes('rs-recovery-guard-v217'));
          for(const path of release.files.filter(x=>x.startsWith('/assets/'))){
            const response=await get(path);
            assert.equal(response.headers.get('x-rs-release'),release.hash);
            assert.ok((await response.arrayBuffer()).byteLength>100,'empty '+path);
          }
          for(const oldHash of ['8eb44596629f','3305352a56bc','e30517cbf40f','73e1a8532289','7d1f0f0bb6bc','bbd2531a1e8d','7ba6f9cb1359','a42623dd9d1b']){
            await get('/assets/rider-spot-'+oldHash+'/app.mjs');
          }
          console.log('NIGHT_SHIFT_V10_ASSETS_ACCEPTED',release.hash);
          NODE
      - run: npx playwright install chromium
      - name: Full five-tab 320/393/412px browser acceptance
        run: |
          RIDER_VISUAL_URL="$RIDER_ORIGIN" node tests/night-shift-v10-browser.cjs
      - name: Synthetic income/expense/settlement/maintenance CRUD on isolated preview
        run: |
          RIDER_TEST_ORIGIN="$RIDER_ORIGIN" RIDER_SCREENSHOTS=/tmp/rider-v10-records node tests/mobile-records-browser.cjs
      - name: Native bridge back navigation and GPS recovery smoke
        run: |
          mkdir -p /tmp/rider-v10-native
          tar -xJf ../rider-spot-android/source.tar.xz -C /tmp/rider-v10-native
          RIDER_TEST_URL="$RIDER_ORIGIN" RIDER_TEST_CASE=native RIDER_APK_BRIDGE=/tmp/rider-v10-native/app/src/main/assets/native-bridge.js node tests/browser.cjs
      - name: Record verified release acceptance
        run: |
          printf 'NIGHT SHIFT v10 — live preview acceptance: passed.\nRelease: 66179994a862\nPreview: %s\nTested: all five tabs at 320/393/412px, financial/garage CRUD, native bridge, old hashes, immutable bundle.\n' "$RIDER_ORIGIN" > docs/NIGHT_SHIFT_V10_QA.txt
      - name: Commit acceptance evidence
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-web/docs/NIGHT_SHIFT_V10_QA.txt
          if ! git diff --cached --quiet; then
            git commit -m 'test(v10): verified isolated NIGHT SHIFT live preview [skip ci]'
            git pull --rebase origin feature/rider-spot-v10-redesign
            git push origin HEAD:feature/rider-spot-v10-redesign
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-night-shift-v10-live-qa
          path: |
            /tmp/rider-spot-night-shift-v10
            /tmp/rider-v10-records
          retention-days: 7
          if-no-files-found: warn
