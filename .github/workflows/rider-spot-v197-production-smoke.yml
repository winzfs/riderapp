name: Rider Spot v197 exact original Neo-Flat live smoke
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-v197-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify live Worker contains the EXACT original high-res images
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const root='https://rider-spot.jazzhjm.workers.dev';
          const release=JSON.parse(readFileSync('prebuilt/release.json','utf8'));
          assert.equal(release.hash,'43baabe380e6');
          const actual=release.files.filter(p=>p.startsWith('/assets/rider-spot-'+release.hash+'/'));
          const list=[['/','index.html'],['/index.html','index.html'],['/sw.js','sw.js'],
            ...actual.map(path=>[path,path.split('/').at(-1)])];
          for(const [url,file] of list){
            const res=await fetch(root+url,{headers:{'Cache-Control':'no-cache'}});
            assert.equal(res.status,200,'bad HTTP: '+url);
            const body=await res.text();
            assert.equal(body,readFileSync('prebuilt/'+file,'utf8'),'unexpected live file: '+url);
            if(file==='app.mjs'){
              assert.ok(body.includes('neo-flat-original-v197'));
              assert.ok(body.includes('data:image/webp;base64,'));
              assert.ok(body.includes('500% 200%'));
              assert.ok(!body.includes('vector-v196'));
              assert.ok(body.includes('record-custom-trigger'));
              assert.ok(body.includes('apply_rider_trip_odometer'));
            }
            console.log('PASS LIVE v197',url,body.length);
          }
          const map=await fetch(root+'/mapdata/manifest.json');
          assert.equal(map.status,200);
          assert.ok((await map.json()).counts,'previous map data missing');
          const old=await fetch(root+'/assets/rider-spot-1bca721f751b/app.mjs');
          assert.equal(old.status,200,'previous release asset missing');
          console.log('PASS v197 real icon and legacy asset compatibility');
          NODE
