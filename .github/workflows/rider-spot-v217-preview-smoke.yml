name: Rider Spot v217 staged recovery hotfix acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v217-preview-smoke.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Assert preview serves hotfix, legacy APIs, weather and timeline
        id: smoke
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee /tmp/rider-v217-preview-smoke.log
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const preview='https://b9ca8e96-rider-spot.jazzhjm.workers.dev';
          const prod='https://rider-spot.jazzhjm.workers.dev';
          (async()=>{
            const [ph,live]=await Promise.all([preview,prod].map(async origin=>{
              const r=await fetch(origin+'/',{headers:{'Cache-Control':'no-cache'}});
              assert.equal(r.status,200,origin+' status');
              return r.text();
            }));
            assert.equal(ph.includes('rs-recovery-guard-v217'),true);
            assert.equal(live.includes('rs-recovery-guard-v217'),false);
            for(const part of ['weather-bar.js','app.mjs','daily-timeline.css','rider-maintenance-v40','rider-finance-v23']){
              assert.equal(ph.includes(part),true,'missing '+part);
            }
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const context=await browser.newContext({viewport:{width:393,height:830},deviceScaleFactor:3,isMobile:true,hasTouch:true,locale:'ko-KR',serviceWorkers:'block'});
              const page=await context.newPage();
              let navigations=0;
              page.on('framenavigated',f=>{if(f===page.mainFrame())navigations++});
              await page.goto(preview+'/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(5000);
              const result=await page.evaluate(()=>{
                const id='11111111-1111-4111-8111-111111111191';
                const safe='11111111-1111-4111-8111-111111111192';
                const record=x=>({id:x,user_id:null,started_at:new Date().toISOString(),ended_at:null,points:[],events:[]});
                const oldApi=window.__rsRideApi;
                const prior=localStorage.getItem('rs:trips:guest');
                const before=document.querySelectorAll('#rs-recovery-guard-v217').length;
                let restored=0;
                try{
                  localStorage.setItem('rs:trips:guest',JSON.stringify([{id,ended_at:new Date().toISOString()}]));
                  window.__rsRideApi={restoreActive(){restored++;return true;}};
                  for(let i=0;i<4;i++) window.__rsRideApi.restoreActive(record(id));
                  const afterDone=restored;
                  window.__rsRideApi.restoreActive(record(safe));
                  return {before,afterDone,afterFresh:restored,tab:window.__rsActiveTab,hasWeatherScript:!!document.querySelector('script[src*="weather-bar.js"]')};
                }finally{
                  if(prior===null)localStorage.removeItem('rs:trips:guest');
                  else localStorage.setItem('rs:trips:guest',prior);
                  window.__rsRideApi=oldApi;
                }
              });
              assert.equal(result.before,1,'hotfix runs once');
              assert.equal(result.afterDone,0,'completed trip reactivated');
              assert.equal(result.afterFresh,1,'fresh real trip restoration blocked');
              assert.equal(result.hasWeatherScript,true,'weather script missing');
              await page.waitForTimeout(12000);
              assert.equal(navigations,1,'page spontaneously navigated');
              console.log('PREVIEW_PASS',JSON.stringify(result), 'navigations',navigations);
              await context.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Publish test outcome for review without touching production
        if: always()
        shell: bash
        run: |
          printf 'smoke=%s\n' '${{ steps.smoke.outcome }}' > v217-preview-qa.txt
          if [[ -s /tmp/rider-v217-preview-smoke.log ]]; then
            tail -35 /tmp/rider-v217-preview-smoke.log >> v217-preview-qa.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v217-preview-qa.txt
          git commit -m 'ci(debug): staged v217 hotfix smoke result [skip ci]'
          git pull --rebase origin feature/rider-spot-native-apk
          git push origin HEAD:feature/rider-spot-native-apk
