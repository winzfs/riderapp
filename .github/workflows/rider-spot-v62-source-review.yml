name: Rider Spot v62 Source Review
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v62-source-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export audit-only web source
        run: |
          mkdir -p /tmp/rs-v62-source
          cp -a rider-spot-web/src rider-spot-web/tests rider-spot-web/scripts rider-spot-web/legacy /tmp/rs-v62-source/
          cp rider-spot-web/package.json rider-spot-web/package-lock.json /tmp/rs-v62-source/
          cp -a rider-spot-web/prebuilt/release.json /tmp/rs-v62-source/
      - uses: actions/upload-artifact@v4
        with:
          name: rider-spot-v62-web-source
          path: /tmp/rs-v62-source
          retention-days: 7
