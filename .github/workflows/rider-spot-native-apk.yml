name: Rider Spot Native APK
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - 'rider-spot-android/**'
      - '.github/workflows/rider-spot-native-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Unpack Rider Spot source
        shell: bash
        run: |
          mkdir -p rider-spot-android/build-src
          tar -xJf rider-spot-android/source.tar.xz -C rider-spot-android/build-src
          test -s rider-spot-android/build-src/app/src/main/java/com/riderspot/android/TrackingService.java
      - name: Guard WebView against multi-window Activity recreation
        shell: bash
        run: |
          set -euo pipefail
          manifest=rider-spot-android/build-src/app/src/main/AndroidManifest.xml
          grep -Fq 'smallestScreenSize|screenLayout|' "$manifest"
          grep -Fq 'uiMode|density|fontScale|layoutDirection' "$manifest"
          echo 'Verified WebView config changes in APK source archive'
      - name: Inspect native WebView lifecycle sources
        shell: bash
        run: |
          set -euo pipefail
          JAVA_DIR="rider-spot-android/build-src/app/src/main/java"
          echo '=== Native source file names ==='
          find "$JAVA_DIR" -type f \( -name '*.java' -o -name '*.kt' \) | sort
          echo '=== WebView lifecycle and navigation references ==='
          grep -RInE 'loadUrl|shouldOverrideUrlLoading|onPageFinished|onRenderProcessGone|onReceivedError|evaluateJavascript|onNewIntent|onCreate|onResume|onPause|onDestroy|WebViewClient|setWebViewClient|window\\.location|history\\.|onBackPressed|doUpdateVisitedHistory' "$JAVA_DIR" || true
          echo '=== MainActivity source ==='
          for path in $(find "$JAVA_DIR" -name 'MainActivity.java' -o -name 'MainActivity.kt'); do
            sed -n '1,440p' "$path"
          done
          echo '=== Native bridge source ==='
          find rider-spot-android/build-src/app/src/main -name native-bridge.js -type f -exec sh -c 'for f; do echo "FILE: $f"; sed -n "1,460p" "$f"; done' sh {} +
          echo '=== Activity lifecycle tail ==='
          for path in $(find "$JAVA_DIR" -name 'MainActivity.java'); do sed -n '570,660p' "$path"; done
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 SDK (preinstalled runner command line tools)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)
          test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check GPS bridge tests
        working-directory: rider-spot-android/build-src
        run: node --test tests/*.test.cjs
      - name: Build APK
        working-directory: rider-spot-android/build-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Confirm installable file
        run: test -s rider-spot-android/build-src/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RiderSpot-Android-1.0.6-GPS-Stability-debug
          path: rider-spot-android/build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
