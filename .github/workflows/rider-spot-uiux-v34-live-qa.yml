name: Rider Spot UIUX v34 live acceptance
on:
  push:
    branches: [design/riderspot-uiux-v34-rearchitecture-20261123]
    paths: [.github/workflows/rider-spot-uiux-v34-live-qa.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run: {working-directory: rider-spot-web}
    env:
      RIDER_ORIGIN: https://rider-spot-atelier-v8-preview.jazzhjm.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm,cache-dependency-path: rider-spot-web/package-lock.json}
      - run: npm ci
      - name: Validate live immutable assets and rollback availability
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const rel=JSON.parse(fs.readFileSync('prebuilt/release.json','utf8'));
          const root=process.env.RIDER_ORIGIN;
          const get=async (path,expectedHash=rel.hash)=>{
            const r=await fetch(root+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(30000)});
            assert.equal(r.status,200,path+': '+r.status);
            if(path.startsWith('/assets/'))assert.equal(r.headers.get('x-rs-release'),expectedHash,path);
            return r;
          };
          const html=await (await get('/')).text();
          assert.ok(html.includes('/assets/rider-spot-'+rel.hash+'/app.mjs'),'current app hash');
          assert.ok(html.includes('/assets/rider-spot-'+rel.hash+'/curated-v9.css'),'current CSS hash');
          assert.ok(html.includes('rs-recovery-guard-v217'),'native recovery guard');
          const sw=await (await get('/sw.js')).text();assert.ok(sw.includes(rel.hash),'service worker matches');
          const assets=rel.files.filter(x=>x.startsWith('/assets/'));assert.equal(assets.length,13);
          for(const p of assets){const bytes=await (await get(p)).arrayBuffer();assert.ok(bytes.byteLength>100,p);}
          const css=await (await get('/assets/rider-spot-'+rel.hash+'/curated-v9.css')).text();
          assert.ok(css.includes('RIDERSPOT V34 REARCHITECTURE'),'actual new CSS');
          const app=await (await get('/assets/rider-spot-'+rel.hash+'/app.mjs')).text();
          assert.ok(app.includes('rs34-app'),'actual new React app');
          await get('/assets/rider-spot-f6627988c229/app.mjs','f6627988c229');
          await get('/mapdata/manifest.json');
          console.log('V34_LIVE_GATEWAY_PASS',root,rel.hash,assets.length);
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Five tabs real preview viewport visual validation
        env: {RIDER_VISUAL_URL: https://rider-spot-atelier-v8-preview.jazzhjm.workers.dev}
        run: node tests/uiux-v34-browser.cjs
      - name: Real preview browser signed-in synthetic CRUD, GPS, Back and finance
        env:
          RIDER_TEST_ORIGIN: https://rider-spot-atelier-v8-preview.jazzhjm.workers.dev
          RIDER_TEST_REMOTE_SOURCE: '1'
          RIDER_SCREENSHOTS: /tmp/rs34-live-records
        run: node tests/mobile-records-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RiderSpot-v34-live-preview-evidence
          path: |
            /tmp/rs34-visual-evidence
            /tmp/rs34-live-records
            rider-spot-web/prebuilt/release.json
          retention-days: 14
          if-no-files-found: warn
