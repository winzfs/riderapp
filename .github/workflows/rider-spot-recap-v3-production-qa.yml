name: Rider Spot recap v3 production release verification
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-recap-v3-production-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate staged immutable release matches latest tested source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const staged=JSON.parse(fs.readFileSync('prebuilt/release.json','utf8'));
          const built=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          assert.equal(staged.hash,'228abe877a8d','Only the reviewed candidate is eligible');
          assert.equal(built.hash,staged.hash,'Staged and source builds differ; do not deploy');
          for(const name of ['app.mjs','daily-timeline.css','native-gps.js']) {
            const from=fs.readFileSync('prebuilt/'+name);
            const next=fs.readFileSync('dist/assets/rider-spot-'+staged.hash+'/'+name);
            assert.ok(from.equals(next),'Unmatched hashed asset '+name);
          }
          console.log('PRODUCTION_LOCAL_CANDIDATE_PASS',staged.hash);
          NODE
      - name: Real production HTTP, PWA, fallback routes, and immutable files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://rider-spot.jazzhjm.workers.dev';
          const hash='228abe877a8d';
          const request=async p=>{
            const res=await fetch(base+p,{headers:{'cache-control':'no-cache','user-agent':'RiderSpot-ReleaseQA'},signal:AbortSignal.timeout(40000)});
            assert.equal(res.status,200,p+': '+res.status);
            return res.text();
          };
          const html=await request('/');
          assert.ok(html.includes('/assets/rider-spot-'+hash+'/app.mjs'),'Production not serving correct shell');
          assert.ok(html.includes('rs-recovery-guard-v217'),'Native GPS recovery guard missing');
          const sw=await request('/sw.js');
          assert.equal(sw,fs.readFileSync('prebuilt/sw.js','utf8'));
          const paths=['app.mjs','daily-timeline.css','native-gps.js','design-system.css','premium-shell.css','curated-v9.css'];
          for(const name of paths){
            const actual=await request('/assets/rider-spot-'+hash+'/'+name);
            assert.equal(actual,fs.readFileSync('prebuilt/'+name,'utf8'),name+' bytes mismatch');
          }
          for(const oldHash of ['9263bc477e45','d7fd89a7c39a']){
            const old=await request('/assets/rider-spot-'+oldHash+'/app.mjs');
            assert.ok(old.length>100000,'Legacy WebView bundle missing '+oldHash);
          }
          const map=JSON.parse(await request('/mapdata/manifest.json'));
          assert.ok(map.counts,'Map data missing');
          const native=await request('/rider-spot-shell-v40.js');
          assert.ok(native.length>100,'Legacy native route missing');
          console.log('PRODUCTION_HTTP_PASS',hash,paths.length,'legacy2','mapdata','native');
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Production interactive smoke 360/393 no surprise reload
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const width of [360,393]){
                const c=await b.newContext({viewport:{width,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block',timezoneId:'Asia/Seoul'});
                await c.addInitScript(()=>{const k='__recap_v2_count';sessionStorage.setItem(k,String(Number(sessionStorage.getItem(k)||0)+1));});
                const p=await c.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));
                await p.goto('https://rider-spot.jazzhjm.workers.dev/',{waitUntil:'domcontentloaded',timeout:40000});
                const nav=p.locator('.bottom-nav button');await nav.first().waitFor({timeout:40000});
                for(const i of [1,2,3,4,0]){await nav.nth(i).click();await p.waitForTimeout(180);}
                await p.waitForTimeout(450);
                const result=await p.evaluate(()=>({boot:Number(sessionStorage.getItem('__recap_v2_count')),overflow:document.documentElement.scrollWidth>innerWidth+2}));
                assert.equal(result.boot,1,'Unexpected document reload '+width);
                assert.equal(result.overflow,false,'Horizontal overflow '+width);
                assert.deepEqual(errors,[],'Page errors '+width);
                console.log('PRODUCTION_MOBILE_PASS',width,result);
                await c.close();
              }
            }finally{await b.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
