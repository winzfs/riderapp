name: Rider Spot weather HUD isolated build
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-weather-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-weather-bundle
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rider-spot-native-apk
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify and freeze only the weather overlay
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const rel=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const dir='dist/assets/rider-spot-'+rel.hash+'/';
          const js=fs.readFileSync(dir+'weather-bar.js','utf8');
          const css=fs.readFileSync(dir+'weather-bar.css','utf8');
          assert.ok(js.includes('rs-weather-hud'));
          assert.ok(js.includes('rs-weather-details'));
          assert.ok(css.includes('.rs-weather-hud'));
          assert.ok(fs.readFileSync('dist/index.html','utf8').includes('weather-bar.js'));
          assert.ok(fs.readFileSync('dist/sw.js','utf8').includes('weather-bar.css'));
          fs.mkdirSync('prebuilt-weather',{recursive:true});
          fs.writeFileSync('prebuilt-weather/weather-bar.js',js);
          fs.writeFileSync('prebuilt-weather/weather-bar.css',css);
          fs.writeFileSync('prebuilt-weather/release.json',JSON.stringify({
            builtFrom:process.env.GITHUB_SHA,
            hash:rel.hash,
            files:['weather-bar.js','weather-bar.css']
          },null,2));
          console.log('PASS weather HUD bundled',rel.hash,js.length,css.length);
          NODE
      - name: Persist verified weather assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt-weather
          if ! git diff --cached --quiet; then
            git commit -m 'build: freeze tested Rider Spot weather HUD [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-weather-hud
          path: rider-spot-web/prebuilt-weather/
