name: Rider Spot inactive production release candidate QA
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-inactive-release-qa.yml'
      - 'rider-spot-web/scripts/verify-release-candidate.mjs'
      - 'rider-spot-web/tests/static-preview-browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rider-spot-inactive-release-qa
  cancel-in-progress: true
jobs:
  test-inactive-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rider-spot-web
    env:
      RIDER_CANDIDATE_URL: https://f764543b-rider-spot.jazzhjm.workers.dev
      RIDER_STATIC_PREVIEW_ORIGIN: https://f764543b-rider-spot.jazzhjm.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inactive production Worker version and route parity
        run: node scripts/verify-release-candidate.mjs
      - name: Install Chromium and run three-width browser tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node tests/static-preview-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-inactive-release-qa
          path: |
            rider-spot-web/release-candidate-qa.json
            rider-spot-web/docs/static-preview-browser-qa.json
          if-no-files-found: ignore
