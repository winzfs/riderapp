      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Native GPS, data and navigation regression tests
        working-directory: /tmp/rider-spot-android
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android SDK 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Compile native Android app
        working-directory: /tmp/rider-spot-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Freeze updated original and separate safe-test APKs
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs-android-artifacts
          cp /tmp/rider-spot-android/app/build/outputs/apk/debug/app-debug.apk /tmp/rs-android-artifacts/RiderSpot-Native-Recovery-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/rider-spot-android')
          gradle=root/'app/build.gradle'
          content=gradle.read_text()
          assert content.count('defaultConfig {')==1
          gradle.write_text(content.replace('defaultConfig {','defaultConfig {\n        applicationIdSuffix ".recoverytest"',1))
          manifest=root/'app/src/main/AndroidManifest.xml'
          s=manifest.read_text()
          s,n=re.subn(r'android:label="[^"]+"','android:label="라이더스팟 복구 테스트"',s,count=1)
          assert n==1
          manifest.write_text(s)
          PY
          cd /tmp/rider-spot-android
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/rs-android-artifacts/RiderSpot-Native-Recovery-SideBySide.apk
          test -s /tmp/rs-android-artifacts/RiderSpot-Native-Recovery-debug.apk
          test -s /tmp/rs-android-artifacts/RiderSpot-Native-Recovery-SideBySide.apk
          find /tmp/rs-android-artifacts -type f -printf "%f %k KB\n"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RiderSpot-Native-Recovery-APK
          path: /tmp/rs-android-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
