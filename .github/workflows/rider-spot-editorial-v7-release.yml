name: Rider Spot Editorial v7 verified build
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-editorial-v7-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rider-spot-editorial-v7-release
  cancel-in-progress: false
jobs:
  verify-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assert v6 style, immutable hash and functional guard
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const base='dist/assets/rider-spot-'+r.hash+'/';
          const html=fs.readFileSync('dist/index.html','utf8');
          const sw=fs.readFileSync('dist/sw.js','utf8');
          const style=fs.readFileSync(base+'editorial-v7.css','utf8');
          const app=fs.readFileSync(base+'app.mjs','utf8');
          assert.match(style,/EDITORIAL V7/);
          assert.match(style,/--ur-canvas:#F7F7F4/);
          assert.match(style,/\.finance-page \.fin-hero/);
          assert.match(style,/\.bike-page \.bike-vehicle/);
          assert.match(html,new RegExp('/assets/rider-spot-'+r.hash+'/editorial-v7\\.css'));
          assert.match(sw,new RegExp('/assets/rider-spot-'+r.hash+'/editorial-v7\\.css'));
          // The original native recovery guard is injected by static-edge.mjs,
          // not stored in the prebuilt unguarded shell.
          assert.match(fs.readFileSync('edge/static-edge.mjs','utf8'),/rs-recovery-guard-v217/);
          for(const marker of ['fin-chart-spotlight','bike-vehicle-tools','rs-community-renewal','rs-renewal-route']){
            assert.ok(app.includes(marker),'Missing retained React UI component '+marker);
          }
          const actualSections=['rs6-map-stage','rs7-map-controls','rs6-finance-stage','rs6-finance-analysis-grid','rs6-garage-stage','rs6-service-board','rs6-history-board','rs6-timeline-controller','rs7-map-label','rs6-community-deck','rs6-community-feed-head'];
          for(const marker of actualSections)assert.ok(app.includes(marker),'Missing real v7 JSX section '+marker);
          assert.match(fs.readFileSync('src/editorial-v7.css','utf8'),/content, not decoration/);
          for(const removed of ['EARNINGS / 01','GARAGE / 02','DAILY ROUTES / 03','LOCAL / 04','YOUR ROUTE']){
            assert.ok(!app.includes(removed),'Ornamental banner still embedded in app: '+removed);
          }
          console.log('EDITORIAL_V7_BUILD_PASS',r.hash,style.length,app.length);
          NODE
      - name: Regression guard for ride sessions, map camera and WebView
        run: |
          mkdir -p /tmp/rider-v7-native
          tar -xJf ../rider-spot-android/source.tar.xz -C /tmp/rider-v7-native
          RIDER_ANDROID_SOURCE=/tmp/rider-v7-native node scripts/check-update-safety.mjs
      - run: npx playwright install chromium
      - name: Local fake-account CRUD and Android bridge
        run: |
          python3 -m http.server 8840 --directory dist >/tmp/rider-v7-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8840/ >/dev/null; then break; fi
            sleep 1
          done
          RIDER_TEST_ORIGIN=http://127.0.0.1:8840 RIDER_SCREENSHOTS=/tmp/rider-v7-build-evidence node tests/mobile-records-browser.cjs
          RIDER_TEST_URL=http://127.0.0.1:8840 RIDER_TEST_CASE=native RIDER_APK_BRIDGE=/tmp/rider-v7-native/app/src/main/assets/native-bridge.js node tests/browser.cjs
      - name: Freeze the exact validated assets for pinned production KV
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const r=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          const dir='dist/assets/rider-spot-'+r.hash;
          const names=['app.mjs','route-worker.mjs','native-gps.js','map-reports.js',
            'design-system.css','workspace-tools.js','tab-resume.js','daily-timeline.css',
            'weather-bar.js','weather-bar.css','premium-shell.css','renewal-layout.css','editorial-v7.css'];
          for(const name of names)fs.copyFileSync(path.join(dir,name),path.join('prebuilt',name));
          for(const name of ['index.html','sw.js','release.json'])
            fs.copyFileSync(path.join('dist',name),path.join('prebuilt',name));
          console.log('EDITORIAL_V7_FROZEN',r.hash,names.length+3);
          NODE
      - name: Commit verified immutable files
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rider-spot-web/prebuilt
          if ! git diff --cached --quiet; then
            git commit -m 'build: freeze verified urban editorial v6 assets [skip ci]'
            git pull --rebase origin feature/rider-spot-native-apk
            git push origin HEAD:feature/rider-spot-native-apk
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-editorial-v7-build-evidence
          path: |
            rider-spot-web/dist/release.json
            /tmp/rider-v7-build-evidence
          retention-days: 7
          if-no-files-found: warn
# final design gate: share control compact at 393px and empty-day timeline test guarded
# final cache safety: pin shell and SW KV keys to release hash; map grid shows all tools
