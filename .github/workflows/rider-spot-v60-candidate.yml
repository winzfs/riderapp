name: Rider Spot v60 Candidate Acceptance
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths:
      - '.github/workflows/rider-spot-v60-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rider-spot-web/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      # QA-only location data: do not place a test facility under the synthetic GPS marker.
      - name: Offset synthetic QA facility from synthetic rider
        run: |
          sed -i "s/lat:35.17,lng:126.83,nickname:/lat:35.1705,lng:126.8312,nickname:/" tests/ui-browser.cjs
          # documentElement is not available during Playwright addInitScript execution.
          sed -i "s/document.documentElement.classList.add('rs-native-shell');/document.addEventListener('DOMContentLoaded',()=>document.documentElement.classList.add('rs-native-shell'),{once:true});/" tests/ui-browser.cjs
      - name: Verify candidate mobile web and Android WebView
        env:
          RIDER_UI_URL: https://urban-ui-rider-spot.jazzhjm.workers.dev/
        run: node tests/ui-browser.cjs
      - name: Verify native GPS bridge against candidate
        env:
          RIDER_TEST_URL: https://urban-ui-rider-spot.jazzhjm.workers.dev/
          RIDER_TEST_CASE: native
          RIDER_APK_BRIDGE: /tmp/rider-apk/app/src/main/assets/native-bridge.js
        run: |
          mkdir -p /tmp/rider-apk
          tar -xf ../rider-spot-android/source.tar.xz -C /tmp/rider-apk
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-spot-v60-candidate-evidence
          path: /tmp/rider-ui-evidence
          retention-days: 14
