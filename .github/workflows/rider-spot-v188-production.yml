name: Rider Spot v188 production release verification
on:
  push:
    branches: [feature/rider-spot-native-apk]
    paths: ['.github/workflows/rider-spot-v188-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rider-spot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm installed v188 production asset bytes and preserved map
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const root='https://rider-spot.jazzhjm.workers.dev',hash='c0e9aab3fdf9';
          assert.equal(JSON.parse(fs.readFileSync('prebuilt/release.json','utf8')).hash,hash);
          for(const [route,file] of [['/','index.html'],['/sw.js','sw.js'],
            ...['app.mjs','design-system.css','tab-resume.js','native-gps.js','workspace-tools.js'].map(n=>['/assets/rider-spot-'+hash+'/'+n,n])]){
            const r=await fetch(root+route,{headers:{'Cache-Control':'no-cache'}});
            assert.equal(r.status,200,route+' HTTP');
            const live=await r.text();
            assert.equal(live,fs.readFileSync('prebuilt/'+file,'utf8'),route+' release mismatch');
            if(file==='app.mjs')assert.ok(live.includes('rs-record-interactive')&&live.includes('__rsHandleBack'),'missing Back or swipe');
            if(file==='design-system.css')assert.ok(live.includes('animation:none!important'),'drag fill-mode override missing');
            console.log('PASS v188 LIVE',route);
          }
          const res=await fetch(root+'/mapdata/manifest.json');assert.equal(res.status,200);
          assert.ok((await res.json()).counts,'map data missing');
          console.log('PASS existing geographic data preserved');
          NODE
